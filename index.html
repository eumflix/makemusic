<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SongDrawer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* 레이아웃: 단계 → 코드 진행·타이머 → 한 마디 한 화면 9열 판(입구 · [퍼즐 · 음] × 4박, 10음 세로) → 안내 → 조작 */
:root{
  --bg:#F8F5F0; --surface:#FFFFFF; --ink:#27204D; --muted:#6A6292; --line:#E2DDEB;
  --bed:#262757; --cell:#343A82; --cell-alt:#3A418C; --lock:#272A62; --cell-ink:#C2C6EE; --grid:rgba(255,255,255,.10);
  --pipe:#FF7F9C; --pipe-edge:#8A1F52; --bore:#181A47;
  --water:#34EAC8; --tank:#FFFFFF; --tank-ink:#27204D;
  --good:#0E9060; --on-good:#FFFFFF; --bad:#E0364A; --on-bad:#FFFFFF;
  --tone-bg:#FFD23F; --tone-ink:#27204D; --h-g:#7BE3A0; --h-y:#FFD23F; --h-o:#FFA24D; --h-r:#FF7A8A;
  --accent:#5E53D8; --on-accent:#FFFFFF;
  --cell-size:clamp(32px,calc((100vw - 56px)/9),56px); --cell-h:calc(var(--cell-size)*.76);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15102B; --surface:#211A42; --ink:#F4EFFF; --muted:#B3A9DA; --line:#3A2F66;
  --bed:#0A0620; --cell:#2C2370; --cell-alt:#332A7C; --lock:#1D1655; --cell-ink:#AFA6EC; --grid:rgba(255,255,255,.07);
  --pipe:#FF8FAA; --pipe-edge:#5C1735; --bore:#0B0724;
  --water:#4DF2D6; --tank:#F4F0FF; --tank-ink:#27204D;
  --good:#4BD99A; --on-good:#06271A; --bad:#FF7A8A; --on-bad:#2D0710;
  --tone-bg:#FFD966; --tone-ink:#27204D;
  --accent:#AB9DFF; --on-accent:#15102B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15102B; --surface:#211A42; --ink:#F4EFFF; --muted:#B3A9DA; --line:#3A2F66;
  --bed:#0A0620; --cell:#2C2370; --cell-alt:#332A7C; --lock:#1D1655; --cell-ink:#AFA6EC; --grid:rgba(255,255,255,.07);
  --pipe:#FF8FAA; --pipe-edge:#5C1735; --bore:#0B0724;
  --water:#4DF2D6; --tank:#F4F0FF; --tank-ink:#27204D;
  --good:#4BD99A; --on-good:#06271A; --bad:#FF7A8A; --on-bad:#2D0710;
  --tone-bg:#FFD966; --tone-ink:#27204D;
  --accent:#AB9DFF; --on-accent:#15102B; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:560px;margin:0 auto;display:grid;gap:12px;min-width:0}

.top{display:none}   /* 단계 표시 줄은 삭제: 코드 선택은 음정 선택 카드의 버튼으로 */
.vseg .tochord{background:var(--fSs);border-color:var(--fS);color:var(--ink);font-weight:600}
@media (max-width:380px){.hud .lvcard{order:-1;grid-template-columns:1fr 1fr;gap:4px;align-content:start}.vseg{display:contents}.vseg .tochord{order:1}.lvcard .helpbtn{grid-column:auto;order:2;margin:0;text-align:center;padding:5px 4px}.vseg button[data-s]{order:3}}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.flow li{display:flex;align-items:center;gap:6px;padding:3px 11px 3px 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.flow b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font:600 11px var(--f-ui)}
.flow .done b{background:var(--good);color:var(--on-good)}
.flow .now{border-color:var(--accent);color:var(--ink);font-weight:600}
.flow .now b{background:var(--accent);color:var(--on-accent)}
.flow .opt{border-style:dashed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:6px 11px;min-width:40px;font-size:13.5px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.seglab{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}

.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.prog{display:grid;gap:6px;align-content:center}
.mchips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mc{display:grid;justify-items:center;padding:4px 2px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
button.mc{font:inherit;color:inherit;cursor:pointer}
.mc.lk{opacity:.5}
.mc .r{font:400 17px/1.2 var(--f-display)}
.mc .nt{font-size:10.5px;color:var(--muted);min-height:16px;white-space:nowrap;letter-spacing:-.04em;max-width:100%;overflow:hidden}
.mc .nt i.b{font-style:normal;font-size:7.5px;letter-spacing:-.1em;margin-left:-.5px}
.mc.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mc.done{background:var(--good);border-color:var(--good);color:var(--on-good)}
.mc.done .nt{color:var(--on-good);font-weight:600}
#cname{font:400 13px/1.3 var(--f-ui);color:var(--muted);min-width:0}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px}
#cnotes{font-size:13px;color:var(--muted);display:flex;flex-wrap:nowrap;align-items:baseline;gap:2px 8px}
#cnotes .cl{white-space:nowrap}
#cnotes{position:relative}
.rbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f-ui);color:var(--accent);background:var(--bg);border:1px solid var(--accent);border-radius:10px;padding:5px 8px;cursor:pointer;min-height:32px}
.rbtn svg{color:var(--ink)}
.tpb{color:var(--ink);border-color:var(--line);padding:5px 9px}
#rslot{display:inline-flex;gap:6px;flex:none}
.rm{position:fixed;inset:0;z-index:60;background:rgba(24,14,60,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.rm .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px;width:min(380px,100%);max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.rm h3{margin:0 0 4px;font:400 20px/1.2 var(--f-display)}
.rm p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.rm .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rm .ro{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 6px 6px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.rm .ro svg{color:var(--ink)}
.rm .ro b{font-size:12.5px;font-weight:600}
.rm .ro[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.band{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px}
.ib{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;min-height:38px}
.ib.off{opacity:.45;border-style:dashed}
.ib.off .ic{filter:grayscale(1)}
.ib.pop{animation:bdnew .4s ease-out}
.ib.tp{font-size:14px;padding:5px 10px;font-family:var(--f-ui)}
.ib.ns{padding:3px;gap:2px;border-color:#25C9A8}
.ib.ns span{padding:6px 11px;border-radius:999px;color:var(--muted);font-weight:500;line-height:1}
.ib.ns span.on{background:#34EAC8;color:#0B3A33;font-weight:700}
.ib .dots{display:inline-flex;gap:3px}
.ib .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.ib .dots i.on{background:var(--good)}
@keyframes bdnew{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.rm .box{position:relative}
.dice{position:absolute;inset:0;z-index:3;display:grid;place-content:center;justify-items:center;gap:14px;background:color-mix(in srgb,var(--surface) 97%,transparent);border-radius:18px}
.dice .dd{width:84px;height:84px}
.dice .df{width:100%;height:100%;box-sizing:border-box;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;background:var(--surface);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--line)}
.dice .df i{align-self:center;justify-self:center;width:14px;height:14px;border-radius:50%}
.dice .df i.on{background:var(--ink)}
.dice .dd.roll{animation:dtumble .55s linear infinite}
.dice .dd.land{animation:dland .42s ease-out}
.dice .dl{font:400 17px/1.2 var(--f-display);color:var(--muted)}
@keyframes dtumble{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-22px) rotate(110deg)}50%{transform:translateY(0) rotate(200deg)}75%{transform:translateY(-12px) rotate(290deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes dland{0%{transform:translateY(-18px) scale(1.15) rotate(12deg)}60%{transform:translateY(0) scale(.95) rotate(-4deg)}100%{transform:none}}
.rm .rr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rm .rnd{font:600 13.5px/1 var(--f-ui);color:var(--accent);background:var(--bg);border:1px dashed var(--accent);border-radius:12px;padding:11px 6px;cursor:pointer}
.rm .ok{margin-top:10px;width:100%;font:600 15px/1 var(--f-ui);color:var(--on-accent);background:var(--accent);border:0;border-radius:12px;padding:12px;cursor:pointer}
#cnotes .cn{font:400 clamp(22px,6.4vw,30px)/1.15 var(--f-display);white-space:nowrap;color:var(--accent);letter-spacing:.02em}
#cnotes .cn.n4{font-size:clamp(16px,4.7vw,23px);letter-spacing:-.02em}
.timer{display:grid;gap:4px}
.trow{display:flex;align-items:baseline;gap:8px}
#tlab{font-size:12.5px;color:var(--muted)}
#tnum{font:400 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.lvcard{display:grid;align-content:center;padding:6px}
.vseg{display:grid;gap:4px;border:0;background:transparent;overflow:visible}
.vseg button{border:1px solid var(--line);border-radius:10px;border-right:1px solid var(--line);text-align:left;white-space:nowrap;padding:5px 10px;font-size:13px;line-height:1.35;min-width:0;background:var(--bg)}
.vseg button:last-child{border-right:1px solid var(--line)}
.vseg button[aria-pressed="true"]{border-color:var(--accent)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
#tfill{height:100%;width:100%;background:var(--water);border-radius:99px}
body[data-phase="flow"] #tfill,body[data-phase="done"] #tfill{opacity:.35}
.go{min-height:40px;margin-top:2px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font:400 18px var(--f-display);padding:0 10px}
.go:disabled{opacity:.5;cursor:default}

.boardwrap{position:relative;display:grid;justify-items:center;gap:8px}
.stage{position:relative;overflow:hidden;width:max-content;max-width:100%;border-radius:16px}
.mview{display:grid;justify-items:center;gap:6px}
.clone{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.mini{position:absolute;inset:0;background:var(--bed);border-radius:16px;z-index:6;cursor:pointer;overflow:hidden}
.mini svg{display:block;width:100%;height:100%}
.mini .mt{font:400 18px var(--f-display);fill:var(--tank);text-anchor:middle}
.mini .slot-on{fill:var(--water);opacity:.12}
.mini .nd{transition:r .25s,fill .25s}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:calc(9*var(--cell-size) + 16px)}
.nav{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:400 18px var(--f-display)}
.nav:disabled{opacity:.4;cursor:default}
.nav.off{opacity:.5}
.nav.ready{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pulse2 1.4s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}}
#rub{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
.heads{display:grid;grid-template-columns:var(--c0,1fr) repeat(8,1fr);width:calc(8*var(--cell-size) + var(--c0,var(--cell-size)) + 16px);padding:0 8px}
.mview.narrow{--cell-size:clamp(32px,calc((100vw - 56px)/8.34),60px);--cell-h:calc(var(--cell-size)*.76);--c0:calc(var(--cell-size)*.34)}
.hd{grid-column:span 2;display:grid;justify-items:center;align-content:center;margin:0 1px;padding:3px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.hd .r{font-size:11.5px;color:var(--muted)}
.hd .nt{font:400 clamp(14px,4.2vw,18px)/1.2 var(--f-display);min-height:20px}
.hd.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hd.plan .nt{color:var(--accent)}
.hd.done{background:var(--good);border-color:var(--good);color:var(--on-good)}
.hd.done .r{color:var(--on-good)}
.board{display:grid;grid-template-columns:var(--c0,var(--cell-size)) repeat(8,var(--cell-size));grid-template-rows:repeat(10,var(--cell-h));background:var(--bed);border-radius:16px;padding:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.board>*{position:relative;min-width:0;min-height:0}
.slot,.inlet{border:0;padding:0;background:var(--cell);box-shadow:inset 0 0 0 .5px var(--grid);border-radius:0}
.slot{touch-action:none}
.slot.alt{background:var(--cell-alt)}
#board.free [data-c="1"]{pointer-events:none}
#board.free [data-c="1"] .pipe,#board.free [data-c="1"] .water{display:none}
#board.free .slot[data-c="1"].has::after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--grid)}
.slot:not(.has)::after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--grid);pointer-events:none}
.slot::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--water) 14%,transparent);pointer-events:none}
.slot.locked{background:var(--lock)}
.slot.pop .pipe{animation:pop .16s ease-out}
@keyframes pop{from{scale:.6}to{scale:1}}
.slot.shake .pipe{animation:shake .25s}
@keyframes shake{25%{translate:-3px 0}75%{translate:3px 0}}
.pipe,.static,.water,.stub{position:absolute;inset:0;width:100%;height:100%}
.water{pointer-events:none;overflow:visible}
.pe,.pb,.pc,.w{fill:none}
.pe{stroke:var(--pipe-edge);stroke-width:36}
.pb{stroke:var(--pipe);stroke-width:28}
.pc{stroke:var(--bore);stroke-width:16}
.w{stroke:var(--water);stroke-width:16}
.cap{fill:var(--pipe);stroke:var(--pipe-edge);stroke-width:3}
.wheel{transform-box:fill-box;transform-origin:center;transition:transform .6s ease-out}
.wheel circle{fill:none;stroke:var(--cell-ink);stroke-width:5}
.wheel path{stroke:var(--cell-ink);stroke-width:5;stroke-linecap:round}
.inlet.open .wheel{transform:rotate(270deg)}
.inlet text{font:400 15px var(--f-display);fill:var(--cell-ink)}
.spill{fill:var(--water);opacity:.9;transform-box:fill-box;transform-origin:center;animation:spill .9s ease-out infinite}
@keyframes spill{from{transform:scale(.6);opacity:.95}to{transform:scale(2.4);opacity:0}}

.tank{background:var(--bed)}
.tsrc{touch-action:none;cursor:grab}
.tank .body{position:absolute;left:17%;right:17%;top:7%;bottom:7%;border-radius:8px;display:grid;place-content:center;background:var(--tank);color:var(--tank-ink)}
.tank .n{font:400 clamp(12px,4vw,20px)/1 var(--f-display);white-space:nowrap}
.tank .n.fl{font-size:clamp(10px,3.3vw,17px);letter-spacing:-.06em}
.tank.oct .body{background:color-mix(in srgb,#F6A5C0 32%,var(--tank))}   /* 한 옥타브 위 음(높은 도·레·미)은 아주 옅은 분홍 */
.tank.wall .body{background:repeating-linear-gradient(135deg,var(--cell) 0 5px,var(--lock) 5px 10px);color:var(--cell-ink);opacity:.8}
.tank.dim .body{opacity:.3}
.pipeonly .static{opacity:.55}
.pipeonly .pc{stroke:var(--water)}
.tank.h-g .body{background:var(--h-g);color:var(--tone-ink)}
.tank.h-y .body{background:var(--h-y);color:var(--tone-ink)}
.tank.h-o .body{background:var(--h-o);color:var(--tone-ink)}
.tank.h-r .body{background:var(--h-r);color:var(--tone-ink)}
.legend{margin:0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 12px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.tank.cand .body{box-shadow:0 0 0 2px color-mix(in srgb,var(--water) 70%,transparent)}
.tank.over .body{box-shadow:0 0 0 3px var(--water)}
.tank.hit .body{background:var(--good);color:var(--on-good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 35%,transparent)}
.tank.hit .stub .pc{stroke:var(--water)}
.tank:not(.cl) .stub.l,.tank:not(.cr) .stub.r{display:none}
#board.free .tank[data-c="2"] .stub.l{display:none}
.tank.bad .body{background:var(--bad);color:var(--on-bad);animation:shake .3s}
.next{outline:3px solid var(--water);outline-offset:-3px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.cap2{font-size:12.5px;color:var(--muted);text-align:center;margin:0}

.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14.5px}
.msg .mvar.hasretry{display:flex;align-items:center;gap:10px}
.msg .mvar.hasretry .mt{flex:1 1 0;min-width:0}
.msg .mvar .retry{margin-left:auto;background:var(--accent);color:var(--on-accent);border-color:var(--accent);font:400 16px var(--f-display);white-space:nowrap}
.msg .mvar b{display:block;font-size:15.5px}
.msg .mvar span{color:var(--muted);font-size:13.5px}
.msg .mfix{display:grid;gap:4px}
.msg .mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.msg .mrow #rslot{margin-left:auto}
.msg .mvar{padding-top:8px;margin-top:8px;border-top:1px dashed var(--line)}
.msg.ok{border-color:var(--good)}
.msg.ok .mvar b{color:var(--good)}
.msg.bad{border-color:var(--bad)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px}
.sm{min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:14px}
.sm[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lab{display:flex;flex-wrap:wrap;gap:8px 18px}

/* 코드 칸과 안내 칸을 한 카드로: 모바일은 [화음 이름 | 리듬] / [도미솔 | 빠르기] 두 줄, 넓은 화면은 이름 아래 한 줄에 도미솔·리듬·빠르기 */
.prog .msg{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:8px 0 0;margin-top:2px}
.card.prog:has(.msg.ok){border-color:var(--good)}
.card.prog:has(.msg.bad){border-color:var(--bad)}
.prog .msg #cname{white-space:nowrap}
.prog .msg .mrow{gap:6px 12px}
@media (max-width:639px){
  .prog .msg .mfix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
  .prog .msg .mrow,.prog .msg #rslot{display:contents}
  .prog .msg #cname{grid-area:1/1}
  .prog .msg #cnotes{grid-area:2/1}
  .prog .msg #rbtn{grid-area:1/2;justify-self:end}

let kick=null;

function ensureAC(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}   // 아이폰: 무음(진동) 스위치를 켜 둬도 소리가 나게
  if(!kick&&IOS){try{                                  // 아이폰: 소리 없는 <audio>를 틀어 두면 웹 오디오가 무음 스위치의 영향을 덜 받음(1초 길이의 진짜 무음 파일)
    const n=8000,u=new Uint8Array(44+n),dv=new DataView(u.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)u[o+i]=t.charCodeAt(i);};
    w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);u.fill(128,44);
    kick=new Audio(URL.createObjectURL(new Blob([u],{type:'audio/wav'})));kick.loop=true;kick.setAttribute('playsinline','');
    const pr=kick.play();if(pr&&pr.catch)pr.catch(()=>{});
  }catch(e){}}
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(ac&&ac.state!=='running'){const r=ac.resume();if(r&&r.catch)r.catch(()=>{});}   // 'suspended'뿐 아니라 아이폰의 'interrupted'도 다시 켬
  if(ac&&!ac._u){ac._u=1;try{const o=ac.createOscillator(),g=ac.createGain();g.gain.value=0;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.02);}catch(e){}}   // 첫 터치에서 한 번 소리 길을 열어 둠
}
let tap=null;                                          // 내보내기 녹음 중에만 잡히는 출력(소리를 예약하는 순간에만 켬)

function tone(f,t,d,v,type){

  const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+(t||0);

/* ---------- 한 판(4마디) · 한 마디(4박) ---------- */
function mkMeasure(rn,mi){                            // 한 마디는 한 화음, 4개 음 열 모두 그 화음의 구성음이 정답
  const pc=pcs(rn),st=ST[state.stage],all=Array.from({length:NR},(_,i)=>i),correct=n=>pc.includes(n%7);
  const whole=W8&&mi===NM-1,root=CD[rn].root;
  const opens=[0,1,2,3].map(()=>{
    if(whole)return all.filter(n=>n%7===root);          // 온음표: 으뜸음(도)만, 높고 낮은 두 옥타브 중에 고름
    const wr=shuffle(all.filter(n=>!correct(n))).slice(0,st.wrongs);
    return all.filter(n=>correct(n)||wr.includes(n));
  });
  const rec=opens.map(o=>{const c=o.filter(n=>pc.includes(n%7));return c[rand(c.length)];});   // 레벨 1 힌트: 무작위 추천 선율
  return {rn,pc,opens,rec,fl:CD[rn].fl};
}

}
function praiseFor(m,seq){                          // 마디를 완성했을 때: 실제로 고른 음을 보고 구체적으로 칭찬
  const mm=R.meas[m],nb=NB(m),q=seq.slice(0,nb),nm=n=>nameOf(n,mm.fl),open=['참 잘했어요!','훌륭해요!','멋지게 이었어요!','잘 만들었어요!'][m%4];
  const chordN=[...new Set(q.filter(n=>mm.pc.includes(n%7)).map(n=>n%7))],uniq=[...new Set(q)];
  const prevLast=m>0&&R.done[m-1]?R.done[m-1][NB(m-1)-1]:undefined;
  const steps=q.slice(1).filter((n,i)=>Math.abs(n-q[i])===1).length,leaps=q.slice(1).filter((n,i)=>Math.abs(n-q[i])>=3).length;

    f.push(`${n0(q[0])}${eun(q[0])} 온음표 하나로 길게 울려서, ‘이제 곡이 끝났다’는 종지의 느낌을 확실히 줬어요.`);
    f.push(q[0]>=7?'높은 도로 끝내서 밝고 시원하게 마무리됐어요.':'낮은 도로 끝내서 묵직하고 안정감 있게 마무리됐어요.');
  }else{
    if(nct.length)f.push(`${[...new Set(nct.map(nm))].join('·')}${eun(nct[0])} 화음 밖의 음인데, 약박에서 한 칸씩만 움직여 지나가는 음으로 아주 자연스럽게 썼어요.`);
    if(prevLast!==undefined&&Math.abs(q[0]-prevLast)===1)f.push(`앞 마디 끝 음 ‘${nm(prevLast)}’에서 바로 이웃한 ‘${nm(q[0])}’로 시작해서, 마디와 마디가 매끄럽게 이어졌어요.`);
    else if(prevLast!==undefined&&q[0]===prevLast)f.push(`앞 마디 끝 음 ‘${nm(prevLast)}’를 그대로 이어받아서, 마디와 마디가 끊김 없이 이어졌어요.`);
    if(chordN.length>=3)f.push(`${chordN.map(p=>sn(p,mm.fl)).join('·')} 세 음을 모두 써서 ${mm.rn} 화음의 소리를 꽉 채웠어요.`);

    else if(leaps>=1&&steps>=1)f.push(`큰 도약과 이웃한 음을 섞어서 선율에 생동감이 있어요.`);
    if(q[3]>q[0]+1)f.push(`선율이 점점 올라가서 밝게 퍼져 나가는 느낌이에요.`);
    else if(q[3]<q[0]-1)f.push(`선율이 차분히 내려와서 마음이 가라앉는 느낌이에요.`);
    if(uniq.length===1)f.push(`같은 음 ‘${nm(q[0])}’를 반복해서 단단하고 힘 있는 리듬이 됐어요.`);
    if(mm.pc[0]%7===q[nb-1]%7)f.push(`마지막 음 ‘${nm(q[nb-1])}’${eun(q[nb-1])} ${mm.rn} 화음의 근음이라 안정적으로 끝났어요.`);

function fillWater(anim,skip){                          // 완성한 마디의 물을 채움. anim이면 들어보기용으로 박자에 맞춰 흐름
  const t=FAST_MS;let d=0;skip=skip||0;           // skip: 들어보기에서 앞부분 물 이동을 생략할 시간(ms)
  const later=(ms,f)=>{const m=ms-skip;if(!anim||m<=0)f();else playT.push(setTimeout(f,m));};
  const seg=(cell,path,dur)=>{
    const o=addWater(cell,path,dur);
    if(!anim){o.w.style.strokeDashoffset=0;return;}
    const st=d-skip;
    if(st+dur<=0){o.w.style.strokeDashoffset=0;return;}
    if(st<0){                                      // 생략 구간에 걸친 칸: 이미 차오른 만큼 보여주고 나머지만 흐름

  };

    const sd=sc.full?t:t*.25;seg(sc,'M0 38L100 38',sd);d+=sd;}
  let r=M.rin,n=0;
  for(let b=0;b<NB();b++){

      const o=PIPES[cell.pipe].o,exit=o.find(x=>x!==entry);
      col.push([cell,exit===opp(entry)?`M${MID[entry].join(' ')}L${MID[exit].join(' ')}`:`M${MID[entry].join(' ')}Q50 38 ${MID[exit].join(' ')}`]);
      r+=DIRS[exit][0];c+=DIRS[exit][1];entry=opp(exit);

function traceConn(){                              // 입구에서 이어진 탱크를 찾아 파이프 조각을 보여줄 탱크를 정함
  const L=new Set(),Rr=new Set(),rows=[];let r=M.rin;
  if(r===undefined)return {L,Rr,rows};
  for(let b=0;b<NB();b++){
    let c=PC(b),entry=3,seen=0,ok=false;
    for(;;){
      if(++seen>60)break;
      const cell=(r>=0&&r<NR&&c>=0&&c<9)?cells[r][c]:null;
      if(!cell)break;
      if(cell.kind==='target'||cell.kind==='wall'){if(entry===3&&c===NC(b)&&cell.kind==='target'){L.add(r*9+c);rows[b]=r;ok=true;}break;}
      if(cell.kind!=='slot'||!cell.pipe)break;
      const o=PIPES[cell.pipe].o;
      if(!o.includes(entry))break;
      const exit=o.find(x=>x!==entry);
      r+=DIRS[exit][0];c+=DIRS[exit][1];entry=opp(exit);
    }
    if(!ok)break;
    if(b<NB()-1){const nx=cells[r][PC(b+1)];if(nx.pipe&&PIPES[nx.pipe].o.includes(3))Rr.add(r*9+NC(b));}
  }
  return {L,Rr,rows};
}
function hintCls(c){                               // 레벨별 힌트 색
  const st=state.stage;
  if(st===0)return M.rec&&M.rec[c.b]===c.n?'g':null;
  if(st===1)return c.correct?'g':null;
  if(st===3)return popCls(M.rn,c.n);
  const prev=c.b===0?entryNote():(R.route[c.b-1]!==undefined?TOP-R.route[c.b-1]:undefined);
  if(c.b>0&&prev===undefined)return c.correct?'g':null;
  const jd=judgeNote(R.m,c.b,c.n,prev);return jd.ok?jd.cls:null;
}

function shakeCell(s){s.el.classList.remove('shake');void s.el.offsetWidth;s.el.classList.add('shake');}
function onSlot(cell){                             // 누를 때마다 모양이 바뀜 (빈 칸 → 6가지 모양 → 빈 칸)
  if(G.phase==='done'){
    if(G.result==='fail'){resetWater();G={phase:'ready'};setHud();}   // 실패 뒤에도 바로 고칠 수 있음
    else{                                          // 완성된 마디: 이은 파이프를 누르면 그 파이프가 지워지고 다시 이어 볼 수 있음
      if(!cell.pipe)return;
      resetWater();R.done[R.m]=null;G={phase:'ready'};
      cell.pipe=null;paint(cell);R.route[cell.b]=undefined;
      setHud();onPipesChanged(true);
      say('','파이프를 지웠어요','다시 이어 보세요. 다 이으면 음악이 흘러요.');
      return;
    }
  }
  if(cell.locked){shakeCell(cell);return;}
  cell.pipe=CYCLE[(CYCLE.indexOf(cell.pipe)+1)%CYCLE.length];
  paint(cell);
  cell.el.classList.add('pop');
  R.route[cell.b]=undefined;
  onPipesChanged(false);
}
function applySegment(k,fr,tr,keep){                    // k박의 퍼즐 열을 fr행에서 tr행으로 자동 연결
  const col=PC(k);
  for(let r=0;r<NR;r++)if(cells[r][col].locked){shakeCell(cells[r][col]);return false;}
  if(!keep&&R.route[k]!==undefined&&R.route[k]!==tr){     // 끝음이 바뀌면 뒤 박은 다시 이어야 함
    for(let j=k+1;j<NB();j++){
      for(let r=0;r<NR;r++){const s=cells[r][PC(j)];if(!s.locked&&s.pipe){s.pipe=null;paint(s);}}
      R.route[j]=undefined;
    }
  }
  const lo=Math.min(fr,tr),hi=Math.max(fr,tr);
  for(let r=0;r<NR;r++){
    const s=cells[r][col];let p=null;
    if(fr===tr){if(r===fr)p='H';}
    else if(r===fr)p=tr<fr?'WN':'SW';
    else if(r===tr)p=tr<fr?'ES':'NE';
    else if(r>lo&&r<hi)p='V';
    s.pipe=p;paint(s);
    if(p)s.el.classList.add('pop');
  }
  R.route[k]=tr;
  tone(fOf(TOP-tr),0,.35,.1);
  return true;
}
function autoLink(){                               // 뒤쪽이 이어져 있는데 앞 박이 끊겼거나 다른 탱크로 가 있으면, 앞 음에서 그 탱크까지 자동으로 다시 이음
  let linked=0;
  for(let it=0;it<5;it++){
    const rows=traceConn().rows;let did=false;
    for(let k=0;k<3&&!did;k++){
      const free0=M.free&&k===0,start=free0?-1:(k===0?M.rin:rows[k-1]);
      if(start===undefined)break;
      let tr=-1;
      for(let r=0;r<NR;r++){
        const tk=cells[r][NC(k)],nx=cells[r][PC(k+1)];
        if(tk.kind==='target'&&nx.pipe&&PIPES[nx.pipe].o.includes(3)){tr=r;break;}
      }
      if(tr<0||rows[k]===tr)continue;
      if(free0){M.rin=R.rin[0]=tr;if(applySegment(0,tr,tr,true)){linked++;did=true;}else break;continue;}
      if(applySegment(k,start,tr,true)){linked++;did=true;}else break;
    }
    if(!did)break;
  }
  return linked;
}

  if(!Object.keys(d.hits).length&&rel===sc0&&sc0.kind==='target'){   // 탱크를 톡 누르면: 지금 불 켜진(잇기 준비) 음에서 이 탱크까지 자동으로 이음
    const k=(sc0.c-2)/2,rows=traceConn().rows;let nb=0;while(nb<NB()&&rows[nb]!==undefined)nb++;
    if(k>nb){say('','앞 음부터 차례로 골라요',`깜빡이는 ${nb+1}번째 음 탱크 줄에서 먼저 골라 주세요.`);refreshGuide();return;}
    if(M.free&&k===0)M.rin=R.rin[0]=sc0.r;
    if(applySegment(k,k===0?M.rin:rows[k-1],sc0.r)){row=sc0.r;n=1;}
  }else{
    if(M.free&&d.b===0&&Object.keys(d.hits).length&&M.rin!==d.r){M.rin=R.rin[0]=d.r;applySegment(0,d.r,d.r);}
    for(let c=d.b*2+2;c<=8;c+=2){
      if(d.hits[c]===undefined)break;
      if(!applySegment((c-2)/2,row,d.hits[c]))break;
      row=d.hits[c];n++;
    }
  }
  if(!n){
    if(rel&&rel.kind==='wall')say('bad','닫힌 탱크예요','빗금 친 탱크로는 음악이 흐를 수 없어요. 깜빡이는 테두리의 열린 탱크를 골라요.');
    else say('',`다음 음 탱크까지 끌어 주세요`,'손가락을 떼지 말고 오른쪽 탱크 위까지 가져가요.');
  }else if([0,1,2,3].slice(0,NB()).every(k=>R.route[k]!==undefined)){
    say('ok',NB()===1?'온음표가 이어졌어요':'4박이 모두 이어졌어요',`${R.route.map(r=>nameOf(TOP-r)).join(' → ')}`);
  }else{
    say('',`${nameOf(TOP-row)}까지 이었어요`,'이어서 다음 음 탱크까지 끌어 주세요.');
  }
  const lk=n?autoLink():0;
  if(n)onPipesChanged(true);else refreshGuide();
  if(lk)say('ok','앞 음과 자동으로 이었어요',`${R.m===0?'입구':'앞 마디의 마지막 음'}에서 이 음까지 파이프를 이어 놨어요.`);
}
board.addEventListener('pointerup',e=>{if(fp)endFree(e);else endDrag(e,true);});
board.addEventListener('pointercancel',e=>{if(fp)endFree(e);else endDrag(e,false);});

/* ---------- 빈 칸·파이프 칸에서 끌기: 지나간 칸을 이어 파이프로 만듦 (끝이 음 탱크면 탱크까지) ---------- */
let fp=null;
const shapeOf=(a,b)=>Object.keys(PIPES).find(k=>PIPES[k].o.includes(a)&&PIPES[k].o.includes(b));
const dirTo=(a,b)=>DIRS.findIndex(d=>d[0]===b.r-a.r&&d[1]===b.c-a.c);
function startFree(e,cell){
  if(cell.locked)return;
  fp={id:e.pointerId,path:[cell],orig:new Map([[cell,cell.pipe]]),cap:false,x:e.clientX,y:e.clientY,end:null};
}
function applyFree(){
  const P=fp.path;
  P.forEach((cell,i)=>{
    if(cell.kind!=='slot')return;
    const prev=P[i-1],next=P[i+1];
    const dn=next?dirTo(cell,next):null,dp=prev?dirTo(cell,prev):null;
    const og=fp.orig.get(cell);let code=null;
    if(dn!==null&&dp!==null)code=shapeOf(dp,dn);
    else if(dn!==null){                              // 시작 칸: 원래 파이프가 그 방향으로 열려 있으면 유지
      if(og&&PIPES[og].o.includes(dn))code=og;
      else{
        let nb=0;while(nb<NB()&&R.route[nb]!==undefined)nb++;
        const exp=nb===0?M.rin:R.route[nb-1];
        code=(nb<NB()&&cell.c===PC(nb)&&cell.r===exp)?shapeOf(3,dn):shapeOf(dn,opp(dn));   // 불 켜진 탱크 바로 옆이면 거기서 이어짐
      }
    }else if(dp!==null){
      code=(og&&PIPES[og].o.includes(dp))?og:shapeOf(dp,opp(dp));
    }
    if(code&&cell.pipe!==code){cell.pipe=code;paint(cell);cell.el.classList.add('pop');}
  });
}
function freeVisit(cell){
  const P=fp.path,L=P[P.length-1];
  if(cell===L)return;
  if(P.length>=2&&cell===P[P.length-2]){           // 되돌아가면 지나온 칸을 원래대로
    const x=P.pop();
    if(x.kind==='slot'){x.pipe=fp.orig.get(x);paint(x);}else fp.end=null;
    applyFree();return;
  }
  if(fp.end||dirTo(L,cell)<0)return;
  let ok=false;
  if(cell.kind==='slot'&&cell.c===L.c&&!cell.locked&&!P.includes(cell))ok=true;
  else if(cell.kind==='target'&&cell.c===L.c+1&&cell.r===L.r)ok=true;
  if(!ok)return;
  if(!fp.cap){
    fp.cap=true;try{board.setPointerCapture(fp.id);}catch(_){}
    if(G.phase==='done'&&G.result==='fail'){resetWater();G={phase:'ready'};setHud();}
    ensureAC();
  }
  P.push(cell);
  if(cell.kind==='slot')fp.orig.set(cell,cell.pipe);else fp.end=cell;
  applyFree();
}
function freeMove(e){
  if(e.pointerId!==fp.id)return;
  const cw=cells[0][1].el.getBoundingClientRect().width||30;
  const dx=e.clientX-fp.x,dy=e.clientY-fp.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(cw/3)));
  for(let i=1;i<=n;i++){const c=cellAt(fp.x+dx*i/n,fp.y+dy*i/n);if(c)freeVisit(c);}
  fp.x=e.clientX;fp.y=e.clientY;
}
function endFree(e){
  if(e.pointerId!==fp.id)return;
  const f=fp;fp=null;
  try{board.releasePointerCapture(e.pointerId);}catch(_){}
  if(f.path.length<2)return;
  if(f.end){tone(fOf(f.end.n),0,.35,.1);say('',`${nameOf(f.end.n)}까지 이었어요`,'이어서 다음 음 탱크까지 이어 보세요. 끊어진 곳은 빈 칸에서 끌어 이을 수 있어요.');}
  else say('','파이프를 이었어요','끝을 음 탱크까지 끌거나, 다른 칸에서 이어서 끌어요.');
  const lk=autoLink();
  onPipesChanged(true);
  if(lk)say('ok','앞 음과 자동으로 이었어요',`${R.m===0?'입구':'앞 마디의 마지막 음'}에서 이 음까지 파이프를 이어 놨어요.`);
}

/* ---------- 물 흐르기: 입구 → 퍼즐 → 음 → 퍼즐 → 음 … 4박 ---------- */
let looping=false,autoT=null;
function cancelAuto(){if(autoT){clearTimeout(autoT);autoT=null;}}
function ensureLoop(){if(!looping){looping=true;requestAnimationFrame(loop);}}
function isComplete(){                             // 입구에서 4박 끝 탱크까지 파이프가 실제로 이어졌는지(음이 맞는지는 보지 않음)
  let r=M.rin,seen=0;
  if(r===undefined)return false;
  for(let b=0;b<NB();b++){
    let c=PC(b),entry=3;
    for(;;){
      if(++seen>200)return false;
      const cell=(r>=0&&r<NR&&c>=0&&c<9)?cells[r][c]:null;
      if(!cell)return false;
      if(cell.kind==='target'){if(entry!==3||c!==NC(b))return false;break;}
      if(cell.kind!=='slot'||!cell.pipe)return false;
      const o=PIPES[cell.pipe].o;
      if(!o.includes(entry))return false;
      const exit=o.find(x=>x!==entry);
      r+=DIRS[exit][0];c+=DIRS[exit][1];entry=opp(exit);
    }
  }
  return true;
}
function armCountdown(ms,quiet){                   // 첫 파이프를 놓으면 3초 뒤 물이 옴
  cancelAuto();ensureAC();
  G={phase:'count',t0:performance.now(),countMs:ms||COUNT_MS,passed:0,ticks:0};
  setHud();
  if(!quiet)say('',`${R.m+1}마디 · 음악 만들기`,'천천히 이어 보세요. 다 이으면 음악이 흘러요.');
}
function beginWater(now){                          // 이어진 상태면 빠르게, 아니면 느리게 시작
  cancelAuto();ensureAC();now=now||performance.now();
  G.phase='flow';G.passed=0;G.ticks=0;G.cur=null;G.perTile=null;
  G.fast=isComplete();
  G.tileMs=G.fast?FAST_MS:ST[state.stage].tile*state.speed;
  setHud();
  say('',G.fast?'음악이 빠르게 흘러요':'음악이 천천히 흘러요',G.fast?'파이프가 모두 이어져 있어요.':'음악보다 앞서 끊긴 곳을 이어 주세요. 다 이으면 빨라져요.');
  G.backed=false;
  if(G.fast){                                      // 파이프가 모두 이어진 채로 흐르면: 물이 첫 탱크에 닿는 때에 맞춰 화음·반주가 함께 시작
    const lead=M.free?0:(G.tileMs*(cells[M.rin][0].full?1:.25)+2.5*G.tileMs)/1000;
    playChord(M.pc,lead,M.fl);playBacking(lead,R.m);G.backed=true;
  }
  beginFlow(now);ensureLoop();
}
function restartFast(){                            // 느리게 흐르던 중 파이프가 다 이어지면 물을 처음부터 다시 흘림(이때부터 소리가 나는 완제품)
  stopPlay();resetWater();beginWater(performance.now());
}
function speedUp(){                                // 흐르는 중에 다 이으면 지금 칸부터 빨라짐
  if(G.phase!=='flow'||G.fast||!G.cur)return;
  const now=performance.now(),p=Math.max(0,Math.min(1,(now-G.tileT0)/G.cur.dur));
  const ms=FAST_MS;
  G.cur.dur*=ms/G.tileMs;if(G.perTile)G.perTile*=ms/G.tileMs;G.tileMs=ms;G.tileT0=now-p*G.cur.dur;G.fast=true;
  say('ok','모두 이어졌어요! 음악이 빨라져요','');
}
function onPipesChanged(quiet){
  if(G.phase==='ready')armCountdown(0,quiet);
  refreshGuide();
  if(G.phase==='flow'){if(!G.fast&&isComplete())restartFast();return;}
  if(G.phase!=='count')return;
  if(isComplete()){
    if(!autoT){
      say('ok','파이프가 모두 이어졌어요','잠깐 뒤 음악이 빠르게 흘러요. 바꾸려면 지금 눌러 보세요.');
      autoT=setTimeout(()=>{autoT=null;if(G.phase==='count'&&isComplete())beginWater();},700);
    }
  }else cancelAuto();
}
function pathLen(r,c,entry){                       // 이 박의 퍼즐 열에서 물이 지나갈 칸 수
  let n=0;
  for(let seen=0;seen<60;seen++){
    const cell=(r>=0&&r<NR&&c>=0&&c<9)?cells[r][c]:null;
    if(!cell||cell.kind!=='slot'||!cell.pipe)break;
    const o=PIPES[cell.pipe].o;if(!o.includes(entry))break;
    n++;const exit=o.find(x=>x!==entry);r+=DIRS[exit][0];c+=DIRS[exit][1];entry=opp(exit);
  }
  return Math.max(1,n);
}
function addWater(cell,d,dur,extra){
  const w=document.createElementNS(NS,'path');
  w.setAttribute('class','w');w.setAttribute('d',d);
  cell.el.querySelector('.water').appendChild(w);
  const len=w.getTotalLength();
  w.style.strokeDasharray=len;w.style.strokeDashoffset=len;
  return Object.assign({cell,r:cell.r,c:cell.c,w,len,dur},extra);
}
function beginFlow(now){
  if(M.free){G.tileT0=now;enter(M.rin,NC(0),3,now);return;}   // 1마디: 입구 없이 첫 음 탱크에서 바로 시작
  const sc=cells[M.rin][0];
  if(sc.full)sc.el.classList.add('open');
  G.cur=addWater(sc,'M0 38L100 38',G.tileMs*(sc.full?1:.25),{exit:1,src:true});
  G.tileT0=now;
}
function loop(now){
  if(G.phase==='count'){
    // 시간 제한 없음: 파이프를 다 이을 때까지 기다림
  }else if(G.phase==='flow'&&G.cur){
    G.cur.w.style.strokeDashoffset=G.cur.len*(1-Math.max(0,Math.min(1,(now-G.tileT0)/G.cur.dur)));
    if(now-G.tileT0>=G.cur.dur)step(now);
  }
  if(G.phase==='flow')requestAnimationFrame(loop);else looping=false;
}
function step(now){
  const c=G.cur;c.w.style.strokeDashoffset=0;
  if(!c.src&&!c.note)G.passed++;
  enter(c.r+DIRS[c.exit][0],c.c+DIRS[c.exit][1],opp(c.exit),now);
}
function enter(r,c,entry,now){
  const cell=(r>=0&&r<NR&&c>=0&&c<9)?cells[r][c]:null;
  if(!cell||cell.kind==='none'||cell.kind==='src')return fail('leak');
  if(cell.kind==='target'||cell.kind==='wall'){
    if(entry!==3)return fail('leak');
    if(cell.kind==='wall')return fail('wall',cell);
    const jd=judgeNote(R.m,cell.b,cell.n,prevNoteFor(cell.b));
    if(!jd.ok)return fail('wrong',cell,jd.why);
    cell.jd=jd;
    return passNote(cell,now);
  }
  if(!cell.pipe||cell.locked)return fail('leak');
  const o=PIPES[cell.pipe].o;
  if(!o.includes(entry))return fail('leak');
  const exit=o.find(x=>x!==entry);
  if(G.cur&&(G.cur.src||G.cur.note))G.perTile=G.tileMs*2.5*(cell.b>0?DUR(cell.b-1):1)/pathLen(r,c,entry);   // 한 박의 시간은 음 높이와 상관없이 일정
  cell.locked=true;cell.el.classList.add('locked');
  const d=exit===opp(entry)?`M${MID[entry].join(' ')}L${MID[exit].join(' ')}`:`M${MID[entry].join(' ')}Q50 38 ${MID[exit].join(' ')}`;
  G.cur=addWater(cell,d,G.perTile||G.tileMs,{entry,exit});G.tileT0=now;
}
function passNote(cell,now){                       // 음 탱크: 같은 화음의 구성음이면 소리가 나고 다음 박으로 이어짐
  cell.el.classList.add('hit','cl','cr');cell.locked=true;
  R.cur[cell.b]=cell.n;
  if(G.fast)tone(fOf(cell.n),0,.7,.12);          // 이어진 완제품이 흐를 때만 소리: 물이 탱크를 지나며 음이 하나씩 울림(느린 압박용 물은 소리 없음)
  if(cell.b===NB()-1)return win();
  const role=roleOf(cell.jd||{cls:'g'},cell.n);
  say('',`${cell.b+1}박 ‘${nameOf(cell.n)}’ 통과 · ${role}`,'음악은 다음 줄로 이어져요.');
  G.cur=addWater(cell,'M0 38L100 38',G.tileMs*.5*DUR(cell.b),{entry:3,exit:1,note:true});G.tileT0=now;
  renderHeads();
}
function finish(result){G.phase='done';G.result=result;setHud();}
function fail(kind,cell,why){
  const prev=G.cur;
  if(kind==='leak'){
    if(prev){
      const [x,y]=MID[prev.exit];
      prev.cell.el.querySelector('.water').insertAdjacentHTML('beforeend',`<circle class="spill" cx="${x}" cy="${y}" r="9"/>`);
    }
    say('bad','음들이 제대로 연결되지 않았어요','');
  }else if(kind==='wall'){
    cell.el.classList.add('bad');
    say('bad','막힌 곳에 부딪혔어요','빗금 친 칸은 닫힌 탱크예요. 열린 탱크로 이어 주세요.');
  }else{
    cell.el.classList.add('bad');
    say('bad',`‘${nameOf(cell.n)}’${eun(cell.n)} 쓸 수 없는 음이에요`,`${cell.b+1}박: ${why||''}`);
  }
  tone(130,0,.35,.08,'sawtooth');tone(98,.12,.4,.08,'sawtooth');
  finish('fail');
}
function win(){
  const seq=R.cur.slice();
  while(seq.length<4)seq.push(seq[0]);                    // 온음표 마디: 같은 음을 길게 이어 둠(길이 0인 칸은 소리·악보에서 건너뜀)
  R.done[R.m]=seq;
  if(R.m<NM-1){
    const nr=TOP-seq[3];
    if(R.keepSet&&R.keepSet.has(R.m)&&R.done[R.m+1]){R.keepSet.delete(R.m);}   // 코드만 바꾼 마디: 뒤 마디의 음정은 지우지 않고 그대로 둠
    else if(R.rin[R.m+1]!==nr){                         // 끝음이 달라졌으면 뒤 마디는 새로 시작
      for(let j=R.m+1;j<NM;j++){R.done[j]=null;R.pipes[j]=null;R.routes[j]=null;if(j>R.m+1)R.rin[j]=undefined;}
      R.rin[R.m+1]=nr;
    }
  }
  winSay();
  finish('win');
  if(!G.backed){ensureAC();soundOnly();}   // (안전장치) 반주 없이 끝났다면 완제품을 한 번 들려줌
}
function resetWater(){                             // 물·잠금·표시를 되돌리고 파이프는 그대로 둠
  cells.forEach(row=>row.forEach(cell=>{
    if(cell.kind==='slot'){cell.locked=false;cell.el.classList.remove('locked','shake');paint(cell);return;}
    if(cell.kind==='target'||cell.kind==='wall')cell.el.classList.remove('bad','hit');
    const w=cell.el.querySelector('.water');if(w)w.innerHTML='';
  }));
  if(M.rin!==undefined&&cells[M.rin]&&cells[M.rin][0])cells[M.rin][0].el.classList.remove('open');
  R.cur=[];
}
function retry(){resetWater();armCountdown();}
let playT=[];
function stopPlay(){playT.forEach(clearTimeout);playT=[];closeOverview(true);}
const leadOf=i=>i===0?0:(FAST_MS*.25+FAST_MS*2.5)/1000;   // 물이 출발해서 첫 음 탱크에 닿기까지
/* ---------- 처음부터 들어보기: 줌아웃한 미니어처에서 4마디 물길이 이어서 흐름 ---------- */
let ov=null;
function closeOverview(now){
  if(!ov)return;
  const o=ov;ov=null;cancelAnimationFrame(o.raf);
  const mv=$('#mview');
  mv.getAnimations().forEach(a=>a.cancel());mv.style.visibility='';
  if(now||!o.el.animate){o.el.remove();return;}
  mv.animate([{transform:'scale(.5)',opacity:0},{transform:'none',opacity:1}],{duration:450,easing:'ease-out'});
  o.el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(2.4)'}],{duration:450,easing:'ease-in'}).onfinish=()=>o.el.remove();
}
function playOverview(){
  stopPlay();ensureAC();saveMeasure();
  let cnt=0;while(cnt<NM&&R.done[cnt])cnt++;
  if(!cnt)return;
  const st=$('#stage'),rc=st.getBoundingClientRect(),W=rc.width,H=rc.height;
  const ns=cnt>4?2:1,Hs=H/ns,pad=ns>1?40:60;                      // 8마디면 오선을 두 줄(1~4마디 / 5~8마디)로 쌓아 보여줌
  const pp=Math.min(9.5,(Hs-pad)/18),su=2*pp,s=su/250;            // pp: 오선 한 음 간격 = 파이프 높이 간격 → 파이프가 악보와 겹침
  const off=Math.max(0,(Hs-pad-18*pp)/2),top=ns>1?8:14,ypos=(sy,n)=>sy*Hs+top+off+15*pp-n*pp;
  const G4=GLYPH.clef,F4=GLYPH.four,NT=GLYPH.note,cw=(G4.x1-G4.x0)*s,dw=(F4.x1-F4.x0)*s;   // 음악용 글꼴 Bravura(SIL OFL)의 글자 모양을 그대로 사용 (250단위 = 오선 한 칸)
  const tsx=6+cw+8,mx=Math.round(tsx+dw+12),step=(W-mx-14)/18.4,slotW=step*4,gp=step*.8;   // 마디 사이에 간격(gp)을 둬서 마디선·마디 전환이 눈에 보이게
  const D=.7,DT=BEAT*4,tk=[],PL=[[],[]];
  for(let i=0;i<cnt;i++){
    const sy=Math.floor(i/4),mi=i%4,pts=PL[sy];
    for(let j=0;j<4;j++){
      const xs=mx+mi*(slotW+gp)+j*step,tx=xs+step*.78,y=ypos(sy,R.done[i][j]);
      if(pts.length){const py=pts[pts.length-1][1];pts.push([xs+step*.3,py]);pts.push([xs+step*.3,y]);}
      pts.push([tx,y]);                                // 줄의 첫 음 탱크에서 물길이 시작(온음표 마디는 같은 높이로 길게 이어짐)
      tk.push({sy,x:tx,y,t:D+i*DT+ONS(j,i)*BEAT,done:false});
    }
  }
  const f2=v=>v.toFixed(1);
  const mkPath=pts=>{                                // 같은 점 제거 후 모서리를 둥글게. 점마다: 직선 누적 길이(pc), 둥글게 깎여 줄어든 길이(sv)
    const lst=pts[pts.length-1];pts.push([lst[0]+step*.22,lst[1]]);
    const P=[pts[0]];pts.forEach(q=>{const l=P[P.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])>.01)P.push(q);});
    let d=`M${f2(P[0][0])} ${f2(P[0][1])}`;const pc=[0],sv=[0];
    for(let q=1;q<P.length;q++)pc[q]=pc[q-1]+Math.hypot(P[q][0]-P[q-1][0],P[q][1]-P[q-1][1]);
    for(let q=1;q<P.length-1;q++){
      const a=P[q-1],c=P[q],b=P[q+1],la=Math.hypot(a[0]-c[0],a[1]-c[1]),lb=Math.hypot(b[0]-c[0],b[1]-c[1]),r=Math.min(5,la/2,lb/2);
      const turn=Math.abs((a[0]-c[0])*(b[1]-c[1])-(a[1]-c[1])*(b[0]-c[0]))/(la*lb)>.5;sv[q]=sv[q-1]+(turn?r*(2-1.6232):0);
      d+=`L${f2(c[0]+(a[0]-c[0])/la*r)} ${f2(c[1]+(a[1]-c[1])/la*r)}Q${f2(c[0])} ${f2(c[1])} ${f2(c[0]+(b[0]-c[0])/lb*r)} ${f2(c[1]+(b[1]-c[1])/lb*r)}`;
    }
    const E=P[P.length-1];d+=`L${f2(E[0])} ${f2(E[1])}`;
    return {P,pc,sv,d,len:pc[P.length-1]-(sv[Math.max(0,P.length-2)]||0)};
  };
  const PS=PL.slice(0,ns).map(mkPath),d=PS.map(q=>q.d).join(''),lenOff=[0,PS[0].len];
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  for(let i=0;i<ns*4;i++){
    const sy=Math.floor(i/4),x0=mx+(i%4)*(slotW+gp);
    svg+=`<rect class="slot-on" data-s="${i}" x="${x0}" y="${sy*Hs+6}" width="${slotW}" height="${Hs-12}" rx="8" style="opacity:0"/>`;
    svg+=`<text class="mt" x="${x0+slotW/2}" y="${sy*Hs+Hs-(ns>1?5:14)}">${i<cnt?R.meas[i].rn:'·'}</text>`;
  }
  const ln=(x1,y1,x2,y2,w,c)=>`<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" style="stroke:${c||'var(--cell-ink)'};stroke-width:${w}"/>`;
  svg+='<g style="opacity:.5">';
  for(let sy=0;sy<ns;sy++){
    for(let n=2;n<=10;n+=2)svg+=ln(6,ypos(sy,n),W-8,ypos(sy,n),1.2,'color-mix(in srgb,var(--cell-ink) 70%,transparent)');   // 오선(파이프 뒤에 깔림)
    for(let i=1;i<=4;i++){const fin=sy===ns-1&&i===4,bx=i===4?mx+3*(slotW+gp)+slotW+step*.05:mx+(i-1)*(slotW+gp)+slotW+gp/2;svg+=ln(bx,ypos(sy,10),bx,ypos(sy,2),fin?2.4:1.3);}   // 마디선
    svg+=`<path d="${G4.d}" transform="translate(${f2(6-G4.x0*s)} ${f2(ypos(sy,4))}) scale(${s.toFixed(5)} ${(-s).toFixed(5)})" style="fill:var(--cell-ink)"/>`;   // 높은음자리표(원점이 솔 선)
    [8,4].forEach(n=>{svg+=`<path d="${F4.d}" transform="translate(${f2(tsx-F4.x0*s)} ${f2(ypos(sy,n))}) scale(${s.toFixed(5)} ${(-s).toFixed(5)})" style="fill:var(--cell-ink)"/>`;});   // 4/4
  }
  svg+='</g>';
  const sty=(c,w)=>`fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(${c});stroke-width:${w}"`;
  let pipeSvg=`<path d="${d}" ${sty('--pipe-edge',6)}/><path d="${d}" ${sty('--pipe',4.4)}/><path d="${d}" ${sty('--bore',2.4)}/>`;
  PS.forEach((q,i)=>{pipeSvg+=`<path class="ovw" d="${q.d}" ${sty('--water',2.4)} stroke-dasharray="0 9999"/>`;});   // 줄마다 따로(점선 무늬는 조각마다 처음부터 다시 시작하므로)
  const ks=s*.56;
  let noteSvg='';
  tk.forEach((t,i)=>{                                                                     // 음표: 파이프가 음 탱크에 닿는 자리, 오선 위 높이 = 파이프 높이
    const n=R.done[Math.floor(i/4)][i%4],x=t.x,y=t.y;
    if(!DUR(i%4,Math.floor(i/4))){noteSvg+=`<g class="sn" data-i="${i}"></g>`;return;}
    let g=`<g class="sn" data-i="${i}" style="color:var(--tank);opacity:.7">`;   // 아직 안 흐른 음표: 밝은 윤곽선(어두운 테두리로 파이프와 분리)
    const it=[{x,y,v:n,dur:DUR(i%4,Math.floor(i/4)),fl:isFlat(n,R.meas[Math.floor(i/4)].fl)}];
    if(n===0)g+=`<line x1="${f2(x-NT.hc*ks-.4*su*.56)}" y1="${f2(y)}" x2="${f2(x+NT.hc*ks+.4*su*.56)}" y2="${f2(y)}" style="stroke:var(--bed);stroke-width:${f2(su*.16+3)};opacity:.7"/><line x1="${f2(x-NT.hc*ks-.4*su*.56)}" y1="${f2(y)}" x2="${f2(x+NT.hc*ks+.4*su*.56)}" y2="${f2(y)}" style="stroke:currentColor;stroke-width:${f2(su*.16)}"/>`;
    g+=noteSet(it,ks,'halo')+noteSet(it,ks,'line');
    noteSvg+=g+'</g>';
  });
  const PF=window.__PF!==undefined?window.__PF:false;   // 파이프를 음표 앞에(반투명) 둘지
  svg+=PF?noteSvg+`<g style="opacity:.6">${pipeSvg}</g>`:pipeSvg+noteSvg;
  svg+='</svg>';
  const el=mk('div','mini',svg);el.setAttribute('role','img');el.setAttribute('aria-label','전체 마디 미니어처 악보. 누르면 닫혀요');
  st.appendChild(el);
  const mv=$('#mview');
  mv.animate([{transform:'none',opacity:1},{transform:'scale(.5)',opacity:0}],{duration:600,easing:'ease-in',fill:'forwards'});
  el.animate([{transform:'scale(2.4)',opacity:0},{transform:'none',opacity:1}],{duration:700,easing:'ease-out'});
  setTimeout(()=>{if(ov&&ov.el===el)mv.style.visibility='hidden';},650);
  const wps=[...el.querySelectorAll('.ovw')];
  const lenAt=t=>{                                 // 탱크 위치까지의 곡선 길이(계산식, 무거운 탐색 없음)
    const S=PS[t.sy],k=S.P.findIndex(q=>Math.abs(q[0]-t.x)<.01&&Math.abs(q[1]-t.y)<.01);
    return k<0?lenOff[t.sy]:lenOff[t.sy]+S.pc[k]-(S.sv[Math.max(0,k-1)]||0);
  };
  const key=[[.25,0],...tk.map(t=>[t.t,lenAt(t)])];
  const nds=[...el.querySelectorAll('.nd')],sn=[...el.querySelectorAll('.sn')],sl=[...el.querySelectorAll('.slot-on')];
  const t0=performance.now(),end=D+(cnt-1)*DT+ONS(3,cnt-1)*BEAT+.1;
  ov={el,raf:0};
  const frame=now=>{
    if(!ov||ov.el!==el)return;
    const t=(now-t0)/1000;let len=0;
    if(t>=key[key.length-1][0])len=key[key.length-1][1];
    else for(let k=1;k<key.length;k++)if(t<key[k][0]){const a=key[k-1],b=key[k];len=t<a[0]?a[1]:a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]);break;}
    wps.forEach((w,i)=>{const v=Math.max(0,Math.min(len-lenOff[i],PS[i].len+10));w.setAttribute('stroke-dasharray',`${v} 99999`);});
    tk.forEach((q,i)=>{if(!q.done&&t>=q.t){q.done=true;if(sn[i]){sn[i].style.color='var(--good)';sn[i].style.opacity='1';}}});
    const cur=Math.min(cnt-1,Math.max(0,Math.floor((t-D+.2)/DT)));
    sl.forEach((r,i)=>r.style.opacity=(t>=D-.1&&i===cur&&t<end)?'.14':'0');
    if(t>end+.15){closeOverview();return;}
    ov.raf=requestAnimationFrame(frame);
  };
  ov.raf=requestAnimationFrame(frame);
  el.addEventListener('click',()=>closeOverview());
  for(let i=0;i<cnt;i++)playNotes(R.done[i],R.meas[i].pc,D+i*DT,i);
}
function playMelody(only){                         // 물이 흐르는 박자에 맞춰 소리·화면이 함께 진행 (입구 쪽 물 이동은 생략하고 바로 시작)
  stopPlay();ensureAC();let t=0;
  const idx=only?[R.m]:R.done.map((_,i)=>i).filter(i=>R.done[i]);
  idx.forEach(i=>{
    const seq=R.done[i];if(!seq)return;
    const lead=leadOf(i);
    playT.push(setTimeout(()=>{goTo(i,true);rewindWater();fillWater(true,Math.max(0,lead*1000-100));},t*1000));
    playNotes(seq,R.meas[i].pc,t+.1,i);
    t+=BEAT*4;
  });
}

function openHelp(steps){steps=steps||TOUR;
  if(document.querySelector('.tour')||document.querySelector('.rm'))return;
  let i=0;
  const ov=mk('div','tour',`<div class="tspot"></div><div class="tip" role="dialog" aria-modal="true" aria-label="사용 설명"><div class="tn"></div><b class="th"></b><p class="tx"></p><div class="tb"><button type="button" class="tskip">건너뛰기</button><span></span><button type="button" class="tprev">◀ 이전</button><button type="button" class="tnext"></button></div></div>`);
  document.body.appendChild(ov);
  const spot=ov.querySelector('.tspot'),tip=ov.querySelector('.tip');
  const rectOf=sel=>{let r=null;sel.forEach(q=>document.querySelectorAll(q).forEach(e=>{const b=e.getBoundingClientRect();if(b.width<2||b.height<2)return;r=r?{l:Math.min(r.l,b.left),t:Math.min(r.t,b.top),r:Math.max(r.r,b.right),b:Math.max(r.b,b.bottom)}:{l:b.left,t:b.top,r:b.right,b:b.bottom};}));return r;};
  const el1=sel=>{for(const q of sel){const e=document.querySelector(q);if(e&&e.getBoundingClientRect().width>1)return e;}return null;};
  const place=()=>{
    const st=steps[i],r=rectOf(st.t);if(!r)return false;
    const pd=7,vw=innerWidth,vh=innerHeight;
    spot.style.cssText=`left:${r.l-pd}px;top:${r.t-pd}px;width:${r.r-r.l+pd*2}px;height:${r.b-r.t+pd*2}px`;
    ov.querySelector('.tn').textContent=`${i+1} / ${steps.length}`;ov.querySelector('.th').textContent=st.h;ov.querySelector('.tx').textContent=st.x;
    ov.querySelector('.tprev').hidden=i===0;ov.querySelector('.tnext').textContent=i===steps.length-1?'끝':'다음 ▶';
    const tw=Math.min(330,vw-24);tip.style.width=tw+'px';
    const th=tip.offsetHeight,below=vh-(r.b+pd),above=r.t-pd;
    let top=below>=th+14||below>=above?r.b+pd+12:r.t-pd-12-th;
    top=Math.max(10,Math.min(top,vh-th-10));
    let left=(r.l+r.r)/2-tw/2;left=Math.max(12,Math.min(left,vw-tw-12));
    tip.style.top=top+'px';tip.style.left=left+'px';
    return true;
  };
  const show=dir=>{
    while(i>=0&&i<steps.length&&!rectOf(steps[i].t))i+=dir;       // 안 보이는 버튼은 건너뜀
    if(i<0){i=0;return show(1);}
    if(i>=steps.length)return close();
    const e=el1(steps[i].t);if(e)e.scrollIntoView({block:'center',inline:'nearest'});
    requestAnimationFrame(()=>{place();ov.querySelector('.tnext').focus({preventScroll:true});});
  };
  const close=()=>{ov.remove();removeEventListener('resize',place);removeEventListener('keydown',key,true);};
  const key=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowRight'){i++;show(1);}else if(e.key==='ArrowLeft'&&i>0){i--;show(-1);}};
  ov.querySelector('.tnext').onclick=()=>{i++;show(1);};
  ov.querySelector('.tprev').onclick=()=>{i--;show(-1);};
  ov.querySelector('.tskip').onclick=close;
  addEventListener('resize',place);addEventListener('keydown',key,true);
  show(1);

function scoreSVG(title,idx){                      // 완성한 마디들의 악보(계이름 포함)를 SVG 문장으로. 1240×877 = A4 가로 비율

let cmapFrom=null;

const CTOUR=[
  {t:['#cRule'],h:'레벨',x:'튜토리얼: 끝까지 이어지는 코드만 불이 켜져요. 장조연습: 모든 코드를 누를 수 있고, 규칙에 안 맞으면 이유를 알려 줘요. 단조연습: C단조 코드로 연습해요. 자유작곡: 장조·단조·응용 코드를 자유롭게 섞어 써요.'},

  {t:['#cSay'],h:'지금 고르는 곳',x:'지금 몇 마디를 고르는지, 어떤 규칙이 적용되는지 알려 줘요.'},
  {t:['#cListen'],h:'코드 들어보기',x:'지금까지 고른 코드 진행을 반주와 함께 들어 봐요.'},
  {t:['#cUndo','#cReset'],h:'지우기',x:'칸을 눌러 선택한 뒤 지우기를 누르면 그 칸 하나만 지워져요. 선택한 칸이 없으면 마지막 칸이 지워지고, 처음부터는 모두 지우고 다시 시작해요.'},
  {t:['#cGo'],h:'음정 고르기',x:'8마디를 모두 규칙대로 채우면 켜져요. 눌러서 2단계 음정 선택으로 넘어가요.'}];
document.addEventListener('click',e=>{if(e.target.closest('#cTourBtn'))openHelp(CTOUR);});
function renderAid(){
  const box=$('#cAid'),done=cDone()&&cedit===null,cur=cedit!==null?cp[cedit-1]:cp[cp.length-1];
  box.hidden=done;if(done)return;
  if(clv<=2){
    box.innerHTML='<div class="aidh"><h3>화음 규칙</h3>'+HB+'</div>'+ruleList(cur);
  }else{
    const from=cmapFrom||cur||null;
    if(cmapFull)box.innerHTML=`<div class="aidh"><h3>규칙 지도</h3>${HB}</div><p class="sub2">코드를 눌러 보면 갈 수 있는 곳이 나와요</p><div class="cmapbox">${chordMap(from,null,true,from===cur?'지금 여기':'여기서 출발',from?null:startOf(3))}${GLEG}<div class="cmore"><button type="button" class="sm more">간단히 ▴</button></div><p>${roleTxt(from)}</p></div>`;
    else box.innerHTML=`<div class="aidh"><h3>다음에 갈 수 있는 코드</h3>${HB}</div><div class="cmapbox">${chordMapMini(from,!from?startOf(3):from===cur?curValid():TL[clv][from],from===cur?'지금 여기':'여기서 출발',cmapFrom&&from!==cur?(cur||'시작'):null)}${GLEG}<p>${roleTxt(from)}</p></div>`;
  }
}
document.addEventListener('click',e=>{if(e.target.closest('#cAid .cback')){cmapFrom=null;renderAid();return;}if(e.target.closest('#cAid .more')){cmapFull=!cmapFull;renderAid();return;}const nd=e.target.closest('#cAid .nd.clk');if(nd){cmapFrom=nd.dataset.r;renderAid();}});
function stuckNow(){if(cedit===null&&cp.length<8&&cp.length>0&&!curValid().length)setTimeout(coachStuck,60);}   // 막다른 길에 닿으면 바로 ‘불가’ 안내
function cCommit(rn){ensureAC();cp.push(rn);chordSound(rn,0);cfb=feedback();cmapFrom=null;renderChord();stuckNow();}
function coach(rn){                                            // 규칙에 안 맞는 코드: ‘불가’와 이유를 알려 주고 다시 고르게 함
  const edit=cedit!==null,cur=edit?cp[cedit-1]:cp[cp.length-1],m=edit?cedit+1:cp.length+1,ok=curValid(),lv=clv,h=homeOf();
  if(clv<=2&&(edit?cedit===0:!cp.length)){const h=homeOf();chordSheet({title:`불가 · 첫 코드는 ${h}예요`,rule:'7',text:`규칙 ⑦: 1, 5, 8마디는 ${h}예요. 곡은 ${clv===2?'단조 으뜸화음':'으뜸화음'} ${h}(집)에서 출발하니까, 1마디에는 ‘${rn}’ 대신 ${h}를 골라 봐요.`,from:null,label:'시작',ok:[h],attempt:rn,clk:false,btns:[{t:'다른 코드 고를게요',cls:'pri'}]});return;}
  if(edit?cedit===0:!cp.length){chordSheet({title:'불가 · 시작은 I · i · Imaj7 중 하나예요',text:'곡은 시작 코드를 하나 골라 시작해요. I는 장조, i는 단조, Imaj7은 재즈예요. 1·5·8마디는 이 시작 코드로 돌아와요.',from:null,label:'시작',ok:startOf(3),attempt:rn,clk:false,btns:[{t:'다른 코드 고를게요',cls:'pri'}]});return;}
  let w;
  const needEnd=(m===8&&endsOf(lv).includes(rn))||(m===5&&endsOf(lv).includes(rn));
  if(edit?(cedit>=2&&cp[cedit-1]===rn&&cp[cedit-2]===rn):rep3(rn)){
    w={rule:'8',from:cur,label:'지금 여기',title:`${rn} 코드를 3마디 연속으로는 쓸 수 없어요`,ok,text:'같은 코드는 두 마디까지만 이어 쓸 수 있어요. 세 마디가 되면 같은 자리에 머무는 느낌이에요.'};
  }else if(!edit&&end3(rn)){
    w={rule:'8',from:cur,label:'지금 여기',title:`마지막 ${h}까지 3마디 연속이 돼요`,ok,text:`6마디가 ${rn}인데 7마디도 ${rn}이면, 마지막 8마디까지 세 마디가 이어져요. 7마디는 다른 코드로 해 봐요.`};
  }else if(needEnd&&!trans(lv,cur,rn)){
    w={rule:cur,from:cur,label:'지금 여기',title:cur===rn?`${m}마디에서 ${cur} 다음에 ${rn}는 쓸 수 없어요`:`${cur} 코드에서는 ${rn} 코드로 갈 수 없어요`,ok:COL(lv).filter(r=>TL[lv][cur].includes(r)),text:`${stuckWhy(cur,m)} ‘지우기’로 앞 마디로 돌아가 다시 골라 봐요.`};
  }else if(m===5){
    w={rule:'7',from:cur,label:'지금 여기',title:`5마디는 ${h}로 시작해요`,ok,text:lv<=2?`규칙 ⑦: 1, 5, 8마디는 ${h}예요. 5마디에는 ‘${rn}’ 대신 ${h}를 골라 봐요.`:`5마디는 시작 코드 ${h}${endsOf(lv).length>1?` 또는 같은 으뜸화음 ${endsOf(lv).find(x=>x!==h)}`:''}로 돌아와요. 8마디 진행은 4마디짜리 악구 두 개라서, 5마디에서 처음 코드로 돌아와 새 악구를 시작해요. ‘${rn}’ 대신 ${h}를 골라 봐요.`};
  }else if(m===8){
    w={rule:'7',from:cur,label:'지금 여기',title:`마지막은 ${endsOf(lv).join('나 ')}로 끝나요`,ok:endsOf(lv).filter(x=>trans(lv,cur,x)),text:lv<=1?`곡은 집(I)으로 돌아와야 끝난 느낌이 나요. ‘${rn}’ 코드로 끝내면 아직 더 이어질 것 같아요.`:`곡은 ‘집’인 ${endsOf(lv).join(' 또는 ')}로 돌아와야 끝난 느낌이 나요. 이걸 종지라고 해요. ‘${rn}’ 코드로 끝내면 아직 이야기가 계속될 것 같아요.`};
  }else{
    const l=COL(lv).filter(r=>TL[lv][cur].includes(r));
    if(cur===rn)w={rule:cur,from:cur,label:'지금 여기',title:`${rn} 코드를 바로 이어 쓰면 흐름이 너무 늘어질 수 있어요`,ok,text:`${lv<=2?'':CROLE[cur]+' '}같은 코드를 바로 이어 쓰면 제자리에 머무는 느낌이에요. ${l.join(' · ')} 중에서 골라 봐요.`};
    else w={rule:cur,from:cur,label:'지금 여기',title:lv<=2?`${cur} → ${rn} 이동은 규칙에 없어요`:`${cur} 코드 다음에 ${rn} 코드는 어색해요`,ok:l,text:lv<=2?`규칙표를 보면, ${cur} 다음에는 ${l.join(', ')}만 올 수 있어요.`:`${CROLE[cur]} 그래서 ${cur} 코드 다음에는 ${l.join(' · ')}로 가요. ${rn} 코드로 가면 흐름이 어색해져요.`};
  }
  if(clv>2)delete w.rule;
  chordSheet({...w,title:'불가 · '+w.title,attempt:rn,clk:false,btns:[{t:'다른 코드 고를게요',cls:'pri'}]});
}
function coachStuck(){                                         // 막다른 길: 이어 갈 코드가 없을 때도 ‘불가’ 안내를 띄움
  const edit=cedit!==null,cur=edit?cp[cedit-1]:cp[cp.length-1],m=edit?cedit+1:cp.length+1;
  const text=edit?'앞 칸의 코드 때문에 이 칸에 올 수 있는 코드가 없어요. 앞 칸을 먼저 바꿔 보세요.':(m===5||m===8?stuckWhy(cur,m):`${cur} 코드 다음에는 ${m}마디로 이어 갈 코드가 없어요.`)+' 앞 마디의 코드를 바꿔야 해요.';
  const w={from:cur||homeOf()||'I',label:'지금 여기',title:'불가 · 이어 갈 코드가 없어요',text,ok:[],attempt:null,clk:false,btns:edit?[{t:'닫기',cls:'pri'}]:[{t:'마지막 칸 지우고 다시 고르기',cls:'pri',fn:cErase},{t:'닫기'}]};
  if(clv<=2&&cur)w.rule=(m===5||m===8)?'7':cur;
  chordSheet(w);
}
function cPick(rn){
  if(cp.length>=8&&cedit===null){cfb={k:'hint',t:'비어 있는 칸을 먼저 눌러 선택해 주세요.'};renderChord();return;}
  if(curValid().includes(rn)){if(cedit!==null){ensureAC();cp[cedit]=rn;chordSound(rn,0);cedit=null;cfb=null;cmapFrom=null;renderChord();stuckNow();}else cCommit(rn);return;}
  if(!curValid().length){coachStuck();return;}
  if(clv===0){                                        // 레벨 1: 꺼진 카드는 누를 수 없음
    cfb={k:'hint',t:'불이 꺼진 코드는 고를 수 없어요. 위의 화음 규칙을 보고 켜진 코드를 골라 봐요.'};renderChord();
    const el=document.querySelector(`#cCards [data-r="${rn}"]`);if(el){el.classList.add('shake');}
    return;
  }
  coach(rn);

function cErase(){                                             // 선택한 칸 하나만 지움(선택이 없으면 마지막 칸)
  cStopPlay();cfb=null;
  const mn=0;
  if(cedit!==null){
    if(cp[cedit]){cp[cedit]=null;while(cp.length&&!cp[cp.length-1])cp.pop();if(cedit>=cp.length)cedit=null;}
  }else if(cp.length>mn){cp.pop();while(cp.length>mn&&!cp[cp.length-1])cp.pop();}
  renderChord();
}
function cStopPlay(){cbusy=false;cplay=-1;}
function cListen(){
  if(cbusy)return;ensureAC();
  const full=cp.slice(),B=BEAT;cbusy=true;
  full.forEach((rn,i)=>{
    if(!rn)return;
    const at=.1+i*4*B;
    chordSound(rn,at);[0,2].forEach(b=>drumHit('kick',at+b*B,.4));[1,3].forEach(b=>drumHit('snare',at+b*B,.15));
    setTimeout(()=>{if(!cbusy)return;cplay=i;renderChord();},at*1000);
  });
  setTimeout(()=>{cStopPlay();renderChord();},(.1+full.length*4*B)*1000+300);
  renderChord();
}
function showView(n){
  document.body.classList.toggle('s1',n===1);
  stopPlay();cStopPlay();
  if(n===1)renderChord();
  else{renderFlow(2);setHud();window.dispatchEvent(new Event('resize'));}

}
function applyProg(prog){                                      // 바뀐 마디만 새로 시작하고, 나머지 마디의 코드·음정은 그대로 둠
  const old=PROG||[];
  if(JSON.stringify(prog)===JSON.stringify(old))return;
  if(!R||old.length!==prog.length||!R.meas){PROG=prog;newRun();return;}
  stopPlay();saveMeasure();
  const ch=[];prog.forEach((r,i)=>{if(r!==old[i])ch.push(i);});
  ch.forEach(i=>{R.meas[i]=mkMeasure(prog[i],i);R.done[i]=null;R.pipes[i]=null;R.routes[i]=null;});
  R.keepSet=new Set(ch);
  PROG=prog;R.m=R.done.findIndex(d=>!d);startMeasure();                // 아직 안 끝낸 첫 마디로(보통 바뀐 마디)
  if(R.done.some(Boolean))say('',`${ch.map(i=>i+1).join('·')}마디 코드가 바뀌었어요`,'바뀐 마디만 새로 이어요. 다른 마디는 그대로예요.');
}
function cGo(){
  if(!cOK())return;
  const prog=cp.slice();
  {const w=clv<=2,lock=clv===0;if(w!==W8||(lock&&state.stage!==0)){W8=w;if(lock)state.stage=0;PROG=null;}   // 튜토리얼·장조·단조연습은 8마디 온음표, 튜토리얼은 ‘화성음만’으로 고정(바뀌면 음정은 새로 시작)
   LOCK=lock;}
  applyProg(prog);
  showView(2);
}
$('#cRule').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clv=+b.dataset.s;cfb=null;cmapFrom=null;cedit=null;
  {const hi=cp.findIndex(x=>!x);if(hi>=0)cp=cp.slice(0,hi);}

document.addEventListener('click',e=>{if(e.target.closest('#cHelp'))chordSheet({title:'코드는 이렇게 이어져요',from:cp[cp.length-1]||null,label:'지금 여기',clk:true,btns:[{t:'닫기',cls:'pri'}],
  extra:'<p class="sub">· 시작 코드(I · i · Imaj7)로 곡의 분위기를 정해요. 1 · 5 · 8마디는 이 코드로 돌아와요.<br>· 끝나기 전 마디는 집으로 풀리는 코드(V, V7, ♭VII …)로 “이제 끝나요” 하고 알려 주면 좋아요(종지).<br>· 화살표는 지금 레벨에서 갈 수 있는 길이에요. 같은 코드는 두 마디까지만 이어 쓸 수 있어요.</p>'});});
document.addEventListener('click',e=>{
  if(e.target.closest('#fl1'))showView(1);

});
PROG=PRESETS[0].slice();
renderFlow(2);
newRun();
showView(1);
})();
