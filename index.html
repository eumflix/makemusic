  --pipe:#FF8FAA; --pipe-edge:#5C1735; --bore:#0B0724;
  --water:#4DF2D6; --tank:#F4F0FF; --tank-ink:#27204D;
  --good:#4BD99A; --on-good:#06271A; --bad:#FF7A8A; --on-bad:#2D0710;
  --tone-bg:#FFD966; --tone-ink:#27204D;

body.tplock #toChord,body.tplock #modeBtn,body.tplock #helpBtn,body.tplock #rbtn,body.tplock #tbtn,body.tplock #fl1,body.tplock #redo1,body.tplock #restart{pointer-events:none;opacity:.5}

function fillWater(anim,skip){                          // 완성한 마디의 물을 채움. anim이면 들어보기용으로 박자에 맞춰 흐름

function traceConn(){                              // 입구에서 이어진 탱크를 찾아 파이프 조각을 보여줄 탱크를 정함
  const L=new Set(),Rr=new Set(),rows=[];let r=M.rin;
  if(r===undefined)return {L,Rr,rows};
  for(let b=0;b<NB();b++){
    let c=PC(b),entry=3,seen=0,ok=false;
    for(;;){
      if(++seen>60)break;
      const cell=(r>=0&&r<NR&&c>=0&&c<9)?cells[r][c]:null;
      if(!cell)break;
      if(cell.kind==='target'||cell.kind==='wall'){if(entry===3&&c===NC(b)&&cell.kind==='target'){L.add(r*9+c);rows[b]=r;ok=true;}break;}
      if(cell.kind!=='slot'||!cell.pipe)break;
      const o=PIPES[cell.pipe].o;
      if(!o.includes(entry))break;
      const exit=o.find(x=>x!==entry);
      r+=DIRS[exit][0];c+=DIRS[exit][1];entry=opp(exit);
    }
    if(!ok)break;
    if(b<NB()-1){const nx=cells[r][PC(b+1)];if(nx.pipe&&PIPES[nx.pipe].o.includes(3))Rr.add(r*9+NC(b));}
  }
  return {L,Rr,rows};
}

function shakeCell(s){s.el.classList.remove('shake');void s.el.offsetWidth;s.el.classList.add('shake');}
function onSlot(cell){                             // 누를 때마다 모양이 바뀜 (빈 칸 → 6가지 모양 → 빈 칸)
  if(G.phase==='done'){
    if(G.result==='fail'){resetWater();G={phase:'ready'};setHud();}   // 실패 뒤에도 바로 고칠 수 있음
    else{                                          // 완성된 마디: 이은 파이프를 누르면 그 파이프가 지워지고 다시 이어 볼 수 있음
      if(!cell.pipe)return;
      resetWater();R.done[R.m]=null;G={phase:'ready'};
      cell.pipe=null;paint(cell);R.route[cell.b]=undefined;
      setHud();onPipesChanged(true);
      say('','이은 음을 지웠어요','다시 이어 보세요. 다 이으면 음악이 흘러나와요.');
      return;
    }
  }
  if(cell.locked){shakeCell(cell);return;}
  cell.pipe=CYCLE[(CYCLE.indexOf(cell.pipe)+1)%CYCLE.length];
  paint(cell);
  cell.el.classList.add('pop');
  R.route[cell.b]=undefined;
  onPipesChanged(false);
}
function applySegment(k,fr,tr,keep){                    // k박의 퍼즐 열을 fr행에서 tr행으로 자동 연결
  const col=PC(k);
  for(let r=0;r<NR;r++)if(cells[r][col].locked){shakeCell(cells[r][col]);return false;}
  if(!keep&&R.route[k]!==undefined&&R.route[k]!==tr){     // 끝음이 바뀌면 뒤 박은 다시 이어야 함
    for(let j=k+1;j<NB();j++){
      for(let r=0;r<NR;r++){const s=cells[r][PC(j)];if(!s.locked&&s.pipe){s.pipe=null;paint(s);}}
      R.route[j]=undefined;
    }
  }
  const lo=Math.min(fr,tr),hi=Math.max(fr,tr);
  for(let r=0;r<NR;r++){
    const s=cells[r][col];let p=null;
    if(fr===tr){if(r===fr)p='H';}
    else if(r===fr)p=tr<fr?'WN':'SW';
    else if(r===tr)p=tr<fr?'ES':'NE';
    else if(r>lo&&r<hi)p='V';
    s.pipe=p;paint(s);

  }

}
function autoLink(){                               // 뒤쪽이 이어져 있는데 앞 박이 끊겼거나 다른 탱크로 가 있으면, 앞 음에서 그 탱크까지 자동으로 다시 이음

  if(!Object.keys(d.hits).length&&rel===sc0&&sc0.kind==='target'){   // 탱크를 톡 누르면: 지금 불 켜진(잇기 준비) 음에서 이 탱크까지 자동으로 이음
    const k=(sc0.c-2)/2,rows=traceConn().rows;let nb=0;while(nb<NB()&&rows[nb]!==undefined)nb++;
    if(R.route[k]===sc0.r&&k<nb){                      // 이미 선택(이어 둔) 음을 한 번 더 톡 누르면: 선택 해제
      for(let j=k;j<NB();j++)for(let r=0;r<NR;r++)if(cells[r][PC(j)].locked){shakeCell(cells[r][PC(j)]);refreshGuide();return;}
      for(let j=k;j<NB();j++){for(let r=0;r<NR;r++){const s=cells[r][PC(j)];if(s.pipe){s.pipe=null;paint(s);}}R.route[j]=undefined;}
      say('',`${k+1}박 ‘${nameOf(sc0.n)}’ 선택을 풀었어요`,k<NB()-1?'뒤쪽 박도 함께 지웠어요. 다시 이어 보세요.':'다시 이어 보세요. 다 이으면 음악이 흘러나와요.');
      onPipesChanged(true);return;
    }
    if(k>nb){say('','앞 음부터 차례로 골라요',`깜빡이는 ${nb+1}번째 음 칸 줄에서 먼저 골라 주세요.`);refreshGuide();return;}
    if(M.free&&k===0)M.rin=R.rin[0]=sc0.r;
    if(applySegment(k,k===0?M.rin:rows[k-1],sc0.r)){row=sc0.r;n=1;}
  }else{
    if(M.free&&d.b===0&&Object.keys(d.hits).length&&M.rin!==d.r){M.rin=R.rin[0]=d.r;applySegment(0,d.r,d.r);}
    for(let c=d.b*2+2;c<=8;c+=2){
      if(d.hits[c]===undefined)break;
      if(!applySegment((c-2)/2,row,d.hits[c]))break;
      row=d.hits[c];n++;
    }
  }
  if(!n){
    if(rel&&rel.kind==='wall')say('bad','닫힌 칸이에요','빗금 친 칸으로는 음악이 흘러갈 수 없어요. 깜빡이는 테두리의 열린 칸을 골라요.');
    else say('',`다음 음 칸까지 끌어 주세요`,'손가락을 떼지 말고 오른쪽 칸 위까지 가져가요.');
  }else if([0,1,2,3].slice(0,NB()).every(k=>R.route[k]!==undefined)){
    say('ok',NB()===1?'온음표가 이어졌어요':'4박이 모두 이어졌어요',`${R.route.map(r=>nameOf(TOP-r)).join(' → ')}`);
  }else{
    say('',`${nameOf(TOP-row)}까지 이었어요`,'이어서 다음 음 칸까지 끌어 주세요.');
  }
  if(rel&&rel.c===sc0.c&&rel.r!==d.r&&(rel.kind==='target'||rel.kind==='wall'))setTimeout(sideways,120);   // 같은 세로줄 안에서 위아래로 끌었다면: ‘멜로디는 옆으로’ 안내
  const lk=n?autoLink():0;
  if(n)onPipesChanged(true);else refreshGuide();
  if(lk)say('ok','앞 음과 자동으로 이었어요',`${R.m===0?'입구':'앞 마디의 마지막 음'}에서 이 음까지 이어 놨어요.`);
}
board.addEventListener('pointerdown',()=>{pend4=false;},true);
board.addEventListener('pointerup',e=>{if(fp)endFree(e);else endDrag(e,true);if(pend4){pend4=false;setTimeout(warn4,0);}});
board.addEventListener('pointercancel',e=>{if(fp)endFree(e);else endDrag(e,false);});

/* ---------- 빈 칸·파이프 칸에서 끌기: 지나간 칸을 이어 파이프로 만듦 (끝이 음 탱크면 탱크까지) ---------- */
let fp=null;
const shapeOf=(a,b)=>Object.keys(PIPES).find(k=>PIPES[k].o.includes(a)&&PIPES[k].o.includes(b));
const dirTo=(a,b)=>DIRS.findIndex(d=>d[0]===b.r-a.r&&d[1]===b.c-a.c);
function startFree(e,cell){
  if(cell.locked)return;
  fp={id:e.pointerId,path:[cell],orig:new Map([[cell,cell.pipe]]),cap:false,x:e.clientX,y:e.clientY,end:null};
}
function applyFree(){
  const P=fp.path;
  P.forEach((cell,i)=>{
    if(cell.kind!=='slot')return;
    const prev=P[i-1],next=P[i+1];
    const dn=next?dirTo(cell,next):null,dp=prev?dirTo(cell,prev):null;
    const og=fp.orig.get(cell);let code=null;
    if(dn!==null&&dp!==null)code=shapeOf(dp,dn);
    else if(dn!==null){                              // 시작 칸: 원래 파이프가 그 방향으로 열려 있으면 유지
      if(og&&PIPES[og].o.includes(dn))code=og;
      else{
        let nb=0;while(nb<NB()&&R.route[nb]!==undefined)nb++;
        const exp=nb===0?M.rin:R.route[nb-1];
        code=(nb<NB()&&cell.c===PC(nb)&&cell.r===exp)?shapeOf(3,dn):shapeOf(dn,opp(dn));   // 불 켜진 탱크 바로 옆이면 거기서 이어짐
      }
    }else if(dp!==null){
      code=(og&&PIPES[og].o.includes(dp))?og:shapeOf(dp,opp(dp));
    }
    if(code&&cell.pipe!==code){cell.pipe=code;paint(cell);cell.el.classList.add('pop');}
  });
}
function freeVisit(cell){
  const P=fp.path,L=P[P.length-1];
  if(cell===L)return;
  if(P.length>=2&&cell===P[P.length-2]){           // 되돌아가면 지나온 칸을 원래대로
    const x=P.pop();
    if(x.kind==='slot'){x.pipe=fp.orig.get(x);paint(x);}else fp.end=null;
    applyFree();return;
  }
  if(fp.end||dirTo(L,cell)<0)return;
  let ok=false;
  if(cell.kind==='slot'&&cell.c===L.c&&!cell.locked&&!P.includes(cell))ok=true;
  else if(cell.kind==='target'&&cell.c===L.c+1&&cell.r===L.r)ok=true;
  if(!ok)return;
  if(!fp.cap){
    fp.cap=true;try{board.setPointerCapture(fp.id);}catch(_){}
    if(G.phase==='done'&&G.result==='fail'){resetWater();G={phase:'ready'};setHud();}
    ensureAC();
  }
  P.push(cell);
  if(cell.kind==='slot')fp.orig.set(cell,cell.pipe);else fp.end=cell;
  applyFree();
}
function freeMove(e){
  if(e.pointerId!==fp.id)return;
  const cw=cells[0][1].el.getBoundingClientRect().width||30;
  const dx=e.clientX-fp.x,dy=e.clientY-fp.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(cw/3)));
  for(let i=1;i<=n;i++){const c=cellAt(fp.x+dx*i/n,fp.y+dy*i/n);if(c)freeVisit(c);}
  fp.x=e.clientX;fp.y=e.clientY;
}
function endFree(e){
  if(e.pointerId!==fp.id)return;
  const f=fp;fp=null;
  try{board.releasePointerCapture(e.pointerId);}catch(_){}
  if(f.path.length<2)return;
  if(f.end){tone(fOf(f.end.n),0,.35,.1);say('',`${nameOf(f.end.n)}까지 이었어요`,'이어서 다음 음 칸까지 이어 보세요. 끊어진 곳은 빈 칸에서 끌어 이을 수 있어요.');}
  else say('','음을 이었어요','끝을 음 칸까지 끌거나, 다른 칸에서 이어서 끌어요.');
  const lk=autoLink();
  onPipesChanged(true);
  if(lk)say('ok','앞 음과 자동으로 이었어요',`${R.m===0?'입구':'앞 마디의 마지막 음'}에서 이 음까지 이어 놨어요.`);
}

/* ---------- 물 흐르기: 입구 → 퍼즐 → 음 → 퍼즐 → 음 … 4박 ---------- */
let looping=false,autoT=null;
function cancelAuto(){if(autoT){clearTimeout(autoT);autoT=null;}}
function ensureLoop(){if(!looping){looping=true;requestAnimationFrame(loop);}}
function isComplete(){                             // 입구에서 4박 끝 탱크까지 파이프가 실제로 이어졌는지(음이 맞는지는 보지 않음)
  let r=M.rin,seen=0;
  if(r===undefined)return false;
  for(let b=0;b<NB();b++){
    let c=PC(b),entry=3;
    for(;;){
      if(++seen>200)return false;
      const cell=(r>=0&&r<NR&&c>=0&&c<9)?cells[r][c]:null;
      if(!cell)return false;
      if(cell.kind==='target'){if(entry!==3||c!==NC(b))return false;break;}
      if(cell.kind!=='slot'||!cell.pipe)return false;
      const o=PIPES[cell.pipe].o;
      if(!o.includes(entry))return false;
      const exit=o.find(x=>x!==entry);
      r+=DIRS[exit][0];c+=DIRS[exit][1];entry=opp(exit);
    }
  }
  return true;
}
function armCountdown(ms,quiet){                   // 첫 파이프를 놓으면 3초 뒤 물이 옴
  cancelAuto();ensureAC();
  G={phase:'count',t0:performance.now(),countMs:ms||COUNT_MS,passed:0,ticks:0};
  setHud();
  if(!quiet)say('',`${R.m+1}마디 · 음악 만들기`,'천천히 이어 보세요. 다 이으면 음악이 흘러나와요.');
}
function beginWater(now){                          // 이어진 상태면 빠르게, 아니면 느리게 시작
  cancelAuto();ensureAC();now=now||performance.now();
  G.phase='flow';G.passed=0;G.ticks=0;G.cur=null;G.perTile=null;
  G.fast=isComplete();
  G.tileMs=G.fast?FAST_MS:ST[state.stage].tile*state.speed;
  setHud();
  say('',G.fast?'음악이 빠르게 흘러나와요':'음악이 천천히 흘러나와요',G.fast?'음이 모두 이어져 있어요.':'음악보다 앞서 끊긴 곳을 이어 주세요. 다 이으면 빨라져요.');
  G.backed=false;G.mel=false;
  if(G.fast){                                      // 파이프가 모두 이어진 채로 흐르면: 물이 첫 탱크에 닿는 때에 맞춰 화음·반주가 함께 시작
    const lead=M.free?0:(G.tileMs*(cells[M.rin][0].full?1:.25)+2.5*G.tileMs)/1000;
    playChord(M.pc,lead,M.fl);playBacking(lead,R.m);G.backed=true;
    {                                                // 멜로디도 반주와 같은 오디오 시계로 미리 예약: 물 애니메이션이 늦어져도 소리는 박자에 정확히 맞음
      const rows=traceConn().rows,seq=[];let ok=true;
      for(let b=0;b<NB()&&ok;b++){
        if(rows[b]===undefined)break;
        const n=TOP-rows[b],prev=b===0?entryNote():seq[b-1];
        if(!judgeNote(R.m,b,n,prev,seq).ok)break;
        seq.push(n);
        tone(fOf(n,M.fl),lead+ONS(b)*BEAT,Math.max(.2,Math.min(isW()?2.6:1.3,DUR(b)*BEAT*.95)),.1);
      }
      G.mel=true;
    }
  }
  beginFlow(now);ensureLoop();
}
function restartFast(){                            // 느리게 흐르던 중 파이프가 다 이어지면 물을 처음부터 다시 흘림(이때부터 소리가 나는 완제품)
  stopPlay();resetWater();beginWater(performance.now());
}
function speedUp(){                                // 흐르는 중에 다 이으면 지금 칸부터 빨라짐
  if(G.phase!=='flow'||G.fast||!G.cur)return;
  const now=performance.now(),p=Math.max(0,Math.min(1,(now-G.tileT0)/G.cur.dur));
  const ms=FAST_MS;
  G.cur.dur*=ms/G.tileMs;if(G.perTile)G.perTile*=ms/G.tileMs;G.tileMs=ms;G.tileT0=now-p*G.cur.dur;G.fast=true;
  say('ok','모두 이어졌어요! 음악이 빨라져요','');
}
function onPipesChanged(quiet){
  if(G.phase==='ready')armCountdown(0,quiet);
  refreshGuide();
  if(G.phase==='flow'){if(!G.fast&&isComplete())restartFast();return;}
  if(G.phase!=='count')return;
  if(isComplete()){
    if(!autoT){
      say('ok','음이 모두 이어졌어요','잠깐 뒤 음악이 빠르게 흘러나와요. 바꾸려면 지금 눌러 보세요.');
      autoT=setTimeout(()=>{autoT=null;if(G.phase==='count'&&isComplete())beginWater();},700);
    }
  }else cancelAuto();
}
function pathLen(r,c,entry){                       // 이 박의 퍼즐 열에서 물이 지나갈 칸 수
  let n=0;
  for(let seen=0;seen<60;seen++){
    const cell=(r>=0&&r<NR&&c>=0&&c<9)?cells[r][c]:null;
    if(!cell||cell.kind!=='slot'||!cell.pipe)break;
    const o=PIPES[cell.pipe].o;if(!o.includes(entry))break;
    n++;const exit=o.find(x=>x!==entry);r+=DIRS[exit][0];c+=DIRS[exit][1];entry=opp(exit);
  }
  return Math.max(1,n);
}
function addWater(cell,d,dur,extra){
  const w=document.createElementNS(NS,'path');
  w.setAttribute('class','w');w.setAttribute('d',d);
  cell.el.querySelector('.water').appendChild(w);
  const len=w.getTotalLength();
  w.style.strokeDasharray=len;w.style.strokeDashoffset=len;
  return Object.assign({cell,r:cell.r,c:cell.c,w,len,dur},extra);
}
function beginFlow(now){
  if(M.free){G.tileT0=now;enter(M.rin,NC(0),3,now);return;}   // 1마디: 입구 없이 첫 음 탱크에서 바로 시작
  const sc=cells[M.rin][0];
  if(sc.full)sc.el.classList.add('open');
  G.cur=addWater(sc,'M0 38L100 38',G.tileMs*(sc.full?1:.25),{exit:1,src:true});
  G.tileT0=now;
}
function loop(now){
  if(G.phase==='count'){
    // 시간 제한 없음: 파이프를 다 이을 때까지 기다림
  }else if(G.phase==='flow'&&G.cur){
    G.cur.w.style.strokeDashoffset=G.cur.len*(1-Math.max(0,Math.min(1,(now-G.tileT0)/G.cur.dur)));
    for(let g=0;g<12&&G.phase==='flow'&&G.cur&&now-G.tileT0>=G.cur.dur;g++)step(now);   // 프레임이 늦어도 밀린 칸을 한 번에 따라잡음
  }
  if(G.phase==='flow')requestAnimationFrame(loop);else looping=false;
}
function step(now){
  const c=G.cur;c.w.style.strokeDashoffset=0;
  if(!c.src&&!c.note)G.passed++;
  const ideal=G.tileT0+c.dur,t=(ideal>now||now-ideal>300)?now:ideal;   // 다음 칸은 ‘칸이 끝났어야 할 시각’부터 시작: 프레임이 늦어 생기는 몇 ms가 칸마다 쌓여 멜로디가 점점 늦어지는 것을 막음
  enter(c.r+DIRS[c.exit][0],c.c+DIRS[c.exit][1],opp(c.exit),t);
}
function enter(r,c,entry,now){
  const cell=(r>=0&&r<NR&&c>=0&&c<9)?cells[r][c]:null;
  if(!cell||cell.kind==='none'||cell.kind==='src')return fail('leak');
  if(cell.kind==='target'||cell.kind==='wall'){
    if(entry!==3)return fail('leak');
    if(cell.kind==='wall')return fail('wall',cell);
    const jd=judgeNote(R.m,cell.b,cell.n,prevNoteFor(cell.b));
    if(!jd.ok)return fail('wrong',cell,jd.why);
    cell.jd=jd;
    return passNote(cell,now);
  }
  if(!cell.pipe||cell.locked)return fail('leak');
  const o=PIPES[cell.pipe].o;
  if(!o.includes(entry))return fail('leak');
  const exit=o.find(x=>x!==entry);
  if(G.cur&&(G.cur.src||G.cur.note))G.perTile=G.tileMs*2.5*(cell.b>0?DUR(cell.b-1):1)/pathLen(r,c,entry);   // 한 박의 시간은 음 높이와 상관없이 일정
  cell.locked=true;cell.el.classList.add('locked');
  const d=exit===opp(entry)?`M${MID[entry].join(' ')}L${MID[exit].join(' ')}`:`M${MID[entry].join(' ')}Q50 38 ${MID[exit].join(' ')}`;
  G.cur=addWater(cell,d,G.perTile||G.tileMs,{entry,exit});G.tileT0=now;
}
function passNote(cell,now){                       // 음 탱크: 같은 화음의 구성음이면 소리가 나고 다음 박으로 이어짐
  cell.el.classList.add('hit','cl','cr');cell.locked=true;
  R.cur[cell.b]=cell.n;
  if(G.fast&&!G.mel)tone(fOf(cell.n),0,.7,.12);          // 이어진 완제품이 흐를 때만 소리: 물이 탱크를 지나며 음이 하나씩 울림(느린 압박용 물은 소리 없음)
  if(cell.b===NB()-1)return win();
  const role=roleOf(cell.jd||{cls:'g'},cell.n);
  say('',`${cell.b+1}박 ‘${nameOf(cell.n)}’ 통과 · ${role}`,'음악은 다음 줄로 이어져요.');
  G.cur=addWater(cell,'M0 38L100 38',G.tileMs*.5*DUR(cell.b),{entry:3,exit:1,note:true});G.tileT0=now;
  renderHeads();
}
function finish(result){G.phase='done';G.result=result;setHud();}
function fail(kind,cell,why){
  const prev=G.cur;
  if(kind==='leak'){
    if(prev){
      const [x,y]=MID[prev.exit];
      prev.cell.el.querySelector('.water').insertAdjacentHTML('beforeend',`<circle class="spill" cx="${x}" cy="${y}" r="9"/>`);
    }
    say('bad','음들이 제대로 연결되지 않았어요','');
  }else if(kind==='wall'){
    cell.el.classList.add('bad');
    say('bad','막힌 곳에 부딪혔어요','빗금 친 칸은 닫힌 칸이에요. 열린 칸으로 이어 주세요.');
  }else{
    cell.el.classList.add('bad');
    say('bad',`‘${nameOf(cell.n)}’${eun(cell.n)} 쓸 수 없는 음이에요`,`${cell.b+1}박: ${why||''}`);
  }
  tone(130,0,.35,.08,'sawtooth');tone(98,.12,.4,.08,'sawtooth');
  finish('fail');
}
function win(){
  const seq=R.cur.slice();
  while(seq.length<4)seq.push(seq[0]);                    // 온음표 마디: 같은 음을 길게 이어 둠(길이 0인 칸은 소리·악보에서 건너뜀)
  R.done[R.m]=seq;
  if(R.m<NM-1){
    const nr=TOP-seq[3];
    if(R.keepSet&&R.keepSet.has(R.m)&&R.done[R.m+1]){R.keepSet.delete(R.m);}   // 코드만 바꾼 마디: 뒤 마디의 음정은 지우지 않고 그대로 둠
    else if(R.rin[R.m+1]!==nr){                         // 끝음이 달라졌으면 뒤 마디는 새로 시작
      for(let j=R.m+1;j<NM;j++){R.done[j]=null;R.pipes[j]=null;R.routes[j]=null;if(j>R.m+1)R.rin[j]=undefined;}
      R.rin[R.m+1]=nr;
    }
  }
  winSay();
  finish('win');
  if(!G.backed){ensureAC();soundOnly();}   // (안전장치) 반주 없이 끝났다면 완제품을 한 번 들려줌
}
function resetWater(){                             // 물·잠금·표시를 되돌리고 파이프는 그대로 둠
  cells.forEach(row=>row.forEach(cell=>{
    if(cell.kind==='slot'){cell.locked=false;cell.el.classList.remove('locked','shake');paint(cell);return;}
    if(cell.kind==='target'||cell.kind==='wall')cell.el.classList.remove('bad','hit');
    const w=cell.el.querySelector('.water');if(w)w.innerHTML='';
  }));
  if(M.rin!==undefined&&cells[M.rin]&&cells[M.rin][0])cells[M.rin][0].el.classList.remove('open');
  R.cur=[];
}
function retry(){resetWater();armCountdown();}
let playT=[];
function stopPlay(){playT.forEach(clearTimeout);playT=[];closeOverview(true);}
const leadOf=i=>i===0?0:(FAST_MS*.25+FAST_MS*2.5)/1000;   // 물이 출발해서 첫 음 탱크에 닿기까지
/* ---------- 처음부터 들어보기: 줌아웃한 미니어처에서 4마디 물길이 이어서 흐름 ---------- */
let ov=null;
function closeOverview(now){
  if(!ov)return;
  const o=ov;ov=null;cancelAnimationFrame(o.raf);
  const mv=$('#mview');

function playOverview(){
  stopPlay();ensureAC();saveMeasure();
  let cnt=0;while(cnt<NM&&R.done[cnt])cnt++;

  const st=$('#stage'),rc=st.getBoundingClientRect(),W=rc.width,H=rc.height;
  const ns=cnt>4?2:1,Hs=H/ns,pad=ns>1?40:60;                      // 8마디면 오선을 두 줄(1~4마디 / 5~8마디)로 쌓아 보여줌
  const pp=Math.min(9.5,(Hs-pad)/18),su=2*pp,s=su/250;            // pp: 오선 한 음 간격 = 파이프 높이 간격 → 파이프가 악보와 겹침
  const off=Math.max(0,(Hs-pad-18*pp)/2),top=ns>1?8:14,ypos=(sy,n)=>sy*Hs+top+off+15*pp-n*pp;
  const G4=GLYPH.clef,F4=GLYPH.four,NT=GLYPH.note,cw=(G4.x1-G4.x0)*s,dw=(F4.x1-F4.x0)*s;   // 음악용 글꼴 Bravura(SIL OFL)의 글자 모양을 그대로 사용 (250단위 = 오선 한 칸)

  const D=.7,DT=BEAT*4,tk=[],PL=[[],[]];
  for(let i=0;i<cnt;i++){
    const sy=Math.floor(i/4),mi=i%4,pts=PL[sy];
    for(let j=0;j<4;j++){
      const xs=mx+mi*(slotW+gp)+j*step,tx=xs+step*.78,y=ypos(sy,R.done[i][j]);
      if(pts.length){const py=pts[pts.length-1][1];pts.push([xs+step*.3,py]);pts.push([xs+step*.3,y]);}
      pts.push([tx,y]);                                // 줄의 첫 음 탱크에서 물길이 시작(온음표 마디는 같은 높이로 길게 이어짐)
      tk.push({sy,x:tx,y,t:D+i*DT+ONS(j,i)*BEAT,done:false});
    }
  }
  const f2=v=>v.toFixed(1);
  const mkPath=pts=>{                                // 같은 점 제거 후 모서리를 둥글게. 점마다: 직선 누적 길이(pc), 둥글게 깎여 줄어든 길이(sv)
    const lst=pts[pts.length-1];pts.push([lst[0]+step*.22,lst[1]]);
    const P=[pts[0]];pts.forEach(q=>{const l=P[P.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])>.01)P.push(q);});
    let d=`M${f2(P[0][0])} ${f2(P[0][1])}`;const pc=[0],sv=[0];
    for(let q=1;q<P.length;q++)pc[q]=pc[q-1]+Math.hypot(P[q][0]-P[q-1][0],P[q][1]-P[q-1][1]);
    for(let q=1;q<P.length-1;q++){
      const a=P[q-1],c=P[q],b=P[q+1],la=Math.hypot(a[0]-c[0],a[1]-c[1]),lb=Math.hypot(b[0]-c[0],b[1]-c[1]),r=Math.min(5,la/2,lb/2);
      const turn=Math.abs((a[0]-c[0])*(b[1]-c[1])-(a[1]-c[1])*(b[0]-c[0]))/(la*lb)>.5;sv[q]=sv[q-1]+(turn?r*(2-1.6232):0);
      d+=`L${f2(c[0]+(a[0]-c[0])/la*r)} ${f2(c[1]+(a[1]-c[1])/la*r)}Q${f2(c[0])} ${f2(c[1])} ${f2(c[0]+(b[0]-c[0])/lb*r)} ${f2(c[1]+(b[1]-c[1])/lb*r)}`;
    }

  };

  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  for(let i=0;i<ns*4;i++){
    const sy=Math.floor(i/4),x0=mx+(i%4)*(slotW+gp);
    svg+=`<rect class="slot-on" data-s="${i}" x="${x0}" y="${sy*Hs+6}" width="${slotW}" height="${Hs-12}" rx="8" style="opacity:0"/>`;
    svg+=`<text class="mt" x="${x0+slotW/2}" y="${sy*Hs+Hs-(ns>1?5:14)}">${i<cnt?R.meas[i].rn:'·'}</text>`;
  }
  const ln=(x1,y1,x2,y2,w,c)=>`<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" style="stroke:${c||'var(--cell-ink)'};stroke-width:${w}"/>`;
  svg+='<g style="opacity:.5">';
  for(let sy=0;sy<ns;sy++){
    for(let n=2;n<=10;n+=2)svg+=ln(6,ypos(sy,n),W-8,ypos(sy,n),1.2,'color-mix(in srgb,var(--cell-ink) 70%,transparent)');   // 오선(파이프 뒤에 깔림)
    for(let i=1;i<=4;i++){const fin=sy===ns-1&&i===4,bx=i===4?mx+3*(slotW+gp)+slotW+step*.05:mx+(i-1)*(slotW+gp)+slotW+gp/2;svg+=ln(bx,ypos(sy,10),bx,ypos(sy,2),fin?2.4:1.3);}   // 마디선
    svg+=`<path d="${G4.d}" transform="translate(${f2(6-G4.x0*s)} ${f2(ypos(sy,4))}) scale(${s.toFixed(5)} ${(-s).toFixed(5)})" style="fill:var(--cell-ink)"/>`;   // 높은음자리표(원점이 솔 선)
    [8,4].forEach(n=>{svg+=`<path d="${F4.d}" transform="translate(${f2(tsx-F4.x0*s)} ${f2(ypos(sy,n))}) scale(${s.toFixed(5)} ${(-s).toFixed(5)})" style="fill:var(--cell-ink)"/>`;});   // 4/4
  }
  svg+='</g>';
  const sty=(c,w)=>`fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(${c});stroke-width:${w}"`;
  let pipeSvg=`<path d="${d}" ${sty('--pipe-edge',6)}/><path d="${d}" ${sty('--pipe',4.4)}/><path d="${d}" ${sty('--bore',2.4)}/>`;
  PS.forEach((q,i)=>{pipeSvg+=`<path class="ovw" d="${q.d}" ${sty('--water',2.4)} stroke-dasharray="0 9999"/>`;});   // 줄마다 따로(점선 무늬는 조각마다 처음부터 다시 시작하므로)
  const ks=s*.56;
  let noteSvg='';
  tk.forEach((t,i)=>{                                                                     // 음표: 파이프가 음 탱크에 닿는 자리, 오선 위 높이 = 파이프 높이
    const n=R.done[Math.floor(i/4)][i%4],x=t.x,y=t.y;
    if(!DUR(i%4,Math.floor(i/4))){noteSvg+=`<g class="sn" data-i="${i}"></g>`;return;}
    let g=`<g class="sn" data-i="${i}" style="color:var(--tank);opacity:.4">`;   // 아직 안 흐른 음표: 밝은 윤곽선(어두운 테두리로 파이프와 분리)
    const it=[{x,y,v:n,dur:DUR(i%4,Math.floor(i/4)),fl:isFlat(n,R.meas[Math.floor(i/4)].fl)}];
    if(n===0)g+=`<line x1="${f2(x-NT.hc*ks-.4*su*.56)}" y1="${f2(y)}" x2="${f2(x+NT.hc*ks+.4*su*.56)}" y2="${f2(y)}" style="stroke:var(--bed);stroke-width:${f2(su*.16+3)};opacity:.7"/><line x1="${f2(x-NT.hc*ks-.4*su*.56)}" y1="${f2(y)}" x2="${f2(x+NT.hc*ks+.4*su*.56)}" y2="${f2(y)}" style="stroke:currentColor;stroke-width:${f2(su*.16)}"/>`;
    g+=noteSet(it,ks,'halo')+noteSet(it,ks,'line');

  });
  const PF=window.__PF!==undefined?window.__PF:false;   // 파이프를 음표 앞에(반투명) 둘지
  svg+=PF?noteSvg+`<g style="opacity:.6">${pipeSvg}</g>`:pipeSvg+noteSvg;
  svg+='</svg>';
  const el=mk('div','mini',svg);el.setAttribute('role','img');el.setAttribute('aria-label','전체 마디 미니어처 악보. 누르면 닫혀요');

function playMelody(only){                         // 물이 흐르는 박자에 맞춰 소리·화면이 함께 진행 (입구 쪽 물 이동은 생략하고 바로 시작)

  const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k,seq=['intro','slots','cards','first'];TUT.nudge=false;
  if(k==='skip'||k==='stay'){const empty=!cp.length;TUT.skipped=true;TUT.finished=true;if(k==='skip')TUT.optout=true;tutStop();return;}   // 건너뛰기는 가이드만 끄고 레벨은 그대로 둠
  if(k==='go'){TUT.finished=true;tutStop();cGo();return;}
  if(k==='next'){TUT.ph=seq[Math.min(3,seq.indexOf(TUT.ph)+1)];}
  else if(k==='prev'){TUT.ph=seq[Math.max(0,seq.indexOf(TUT.ph)-1)];}
  else if(k==='fb'){TUT.fb=null;if(TUT.ph==='wrong'){TUT.ph='pick';TUT.seenWrong=true;}}
  else if(k==='skipwrong'){TUT.ph='pick';TUT.seenWrong=true;}
  tutRender();
}
document.addEventListener('click',e=>{                    // 불이 꺼진 카드를 눌렀을 때: 기본 안내 대신 튜토리얼이 이유를 설명
  if(!TUT.on)return;
  if((TUT.ph==='slots'||TUT.ph==='cards')&&e.target.closest('#cCards,#cSlots')){e.stopPropagation();e.preventDefault();TUT.nudge=true;tutRender();return;}   // 설명 단계에서 카드·칸을 누르면 진행되지 않고 ‘다음’을 안내const c=e.target.closest('#cCards .ccard');if(!c)return;
  const c=e.target.closest('#cCards .ccard');if(!c)return;
  if(!['pick','wrong'].includes(TUT.ph)||curValid().includes(c.dataset.r))return;
  e.stopPropagation();e.preventDefault();TUT.fb=tutWhy(c.dataset.r);if(TUT.ph==='wrong')TUT.fb.t='🔍 '+TUT.fb.t;tutRender();
},true);
document.addEventListener('click',e=>{
  if(!e.target.closest('#cTutBtn'))return;
  const go=()=>{cp=[];cfb=null;cedit=null;TUT.skipped=false;TUT.finished=false;TUT.optout=false;TP.skipped=false;TP.finished=false;renderChord();};
  if(cp.length)confirmBox('가이드를 처음부터 볼까요?','가이드는 빈 칸에서 시작해요. 지금까지 고른 코드가 모두 지워져요.','처음부터 보기',go);else go();
});

/* ---------- 튜토리얼 가이드 (음정 선택 · 레벨 ‘튜토리얼’) ---------- */
const tpFull=m=>m===0||m===1||m===NM-1;                       // 1·2·8마디는 하나하나 안내, 3~7마디는 짧은 한 줄 힌트
const tpNb=()=>{let n=0;while(n<NB()&&R.route[n]!==undefined)n++;return n;};
function tpStart(){tutEnsure();TP.on=true;TP.step=0;TP.rhy=0;TP.wrong=0;TP.fb=null;TP.spotKey='';TP.html='';document.body.classList.add('tplock');tpRender();tutKick();}
function tpStop(){const was=TP.on;TP.on=false;TP.v=null;document.body.classList.remove('tplock','tplite');if(was&&!TUT.on)['tdim','tring','tcoach'].forEach(i=>{const e=$('#'+i);if(e)e.remove();});}
function tpSync(){
  const inP=!document.body.classList.contains('s1');
  if(!inP||clv!==0||!R||!M){if(TP.on)tpStop();return;}
  if(!TP.on){if(!TP.skipped&&!TP.finished&&!TUT.optout&&!hasProgress())tpStart();return;}
  tpRender();
}
function tpView(){
  const m=R.m,nb=tpNb(),done=!!R.done[m],full=tpFull(m),notes=M.pc.map(n=>sn(n,M.fl)).join('·'),last=m===NM-1,B='#board';
  const fail=G.phase==='done'&&G.result==='fail';
  const sk={k:'skip',t:'건너뛰기',gh:1};
  if(TP.fb)return {spot:[B],pulse:true,walls:0,title:TP.fb.t,cls:'no',body:TP.fb.b,btns:[{k:'fb',t:TP.wrong?'다시 골라 볼게요':'알겠어요, 이어 갈게요',pri:1}]};
  if(fail)return {lite:1,spot:['#mvar'],title:'앗, 음악이 멈췄어요',cls:'no',body:'음이 끊겼거나 닫힌 칸으로 갔어요. 안내 줄의 <b>다시하기</b>를 누르거나, 깜빡이는 칸부터 다시 이어 보세요.',btns:[sk]};
  if(done){
    if(last)return {lite:1,spot:['#play','#xpt'],pulse:true,title:'🎉 8마디 완성! 곡이 만들어졌어요',body:'코드 위에 멜로디까지 얹었어요. <b>처음부터 들어보기</b>로 내 곡을 들어 보고, <b>음악 다운로드</b>로 저장할 수도 있어요. 장조연습으로 가면 지금 곡은 지워져요.',btns:[{k:'hearall',t:'▶ 전체 듣기'},{k:'finish',t:'장조연습으로 ▸',pri:1},{k:'stay',t:'더 둘러볼게요',gh:1}]};
    if(!full)return {lite:1,spot:['#next'],pulse:true,title:`${m+1}마디 완성! 👏`,body:'아래 <b>다음마디 ▶</b>를 눌러요.',btns:[sk]};
    return {spot:['#next'],pulse:true,title:`${m+1}마디 완성! 👏`,body:`${praiseFor(m,R.done[m])}<br>마지막 음이 <b>다음 마디의 입구</b>가 돼요. <b>다음마디 ▶</b>를 눌러요.`,btns:[{k:'hear',t:'🔊 이 마디 들어보기'},sk]};
  }
  if(nb>=NB())return {spot:[B],title:last?'온음표가 이어졌어요':'4박이 모두 이어졌어요',body:'잠시 뒤 음악이 흘러가며 내가 고른 멜로디가 들려요. 🎵',btns:[sk]};
  if(!full)return {lite:1,spot:null,title:nb?`${m+1}마디 · ${nb+1}박`:`${m+1}마디 · ${M.rn} 화음`,body:nb?'깜빡이는 칸 중에서 이어 갈 음을 골라요.':`화성음 <b>${notes}</b> 중에서 ${NB()}개 음을 이어요. 앞 마디 끝음에서 시작해요.`,btns:[sk]};
  if(m===0&&nb===0&&TP.step<3){
    if(TP.step===0)return {spot:null,title:'🎶 이제 멜로디를 만들어요',body:'코드 8개가 정해졌어요. 이제 마디마다 <b>음</b>을 골라 <b>멜로디</b>를 만들어요. <b>4박</b>(음 4개)을 이어 마디를 완성하면 소리가 나요.',btns:[sk,{k:'next',t:'다음 ▸',pri:1}]};
    if(TP.step===1)return {spot:['#mchips','.mfix'],solid:1,title:'1~8마디, 마디마다 코드가 있어요',body:'위 칩이 방금 고른 코드예요. 지금은 <b>1마디 · I</b>예요. 마디를 다 이으면 다음 마디가 열려요.',btns:[{k:'prev',t:'◂ 이전'},{k:'next',t:'다음 ▸',pri:1}]};
    return {spot:['.mfix'],solid:1,title:'화성음이 뭘까요?',body:`이 마디의 코드 ${M.rn}는 <b>${notes}</b> 세 음으로 이뤄져요. 이렇게 코드를 이루는 음이 <b>화성음</b>이에요. 초보 방식에서는 <b>화성음 칸만 열려</b> 있어서 어느 음을 골라도 어울려요.`,btns:[{k:'prev',t:'◂ 이전'},{k:'next',t:'다음 ▸',pri:1}]};
  }
  if(m===1&&nb===0&&!TP.rhy)return {spot:['#rbtn'],solid:1,pulse:true,title:'리듬도 바꿀 수 있어요',body:'<b>리듬</b> 버튼으로 마디의 박자 모양(또박또박, 통통…)을 고를 수 있어요. 지금은 그대로 두고 갈게요.',btns:[sk,{k:'next',t:'다음 ▸',pri:1}]};
  if(last){
    if(nb===0)return {spot:[B],pulse:true,walls:1,title:'마지막 8마디: 온음표 하나',body:`곡을 마무리하는 마디예요. 으뜸음 <b>${sn(M.pc[0],M.fl)}</b>를 <b>높게</b> 할지 <b>낮게</b> 할지만 골라요. 앞 마디가 끝난 음(‘${nameOf(TOP-M.rin)}’)에서 이어지고, 이 음이 곡이 끝난 느낌(종지)을 줘요.`,btns:[sk]};
  }
  if(m===0){
    if(nb===0)return {spot:[B],pulse:true,walls:1,title:'1박: 첫 음을 골라요',body:`깜빡이는 칸이 이 마디에서 쓸 수 있는 음(<b>${notes}</b>)이에요. 마음에 드는 음을 <b>톡 눌러</b> 보세요.`,btns:[sk]};
    if(nb===1)return {spot:[B],pulse:true,walls:1,title:'음을 이어요',body:`이제 <b>2박 음</b>이에요. 이어진 음에서 오른쪽 칸까지 <b>손가락을 끌거나</b>, 칸을 <b>톡 눌러도</b> 음끼리 이어져요.`,btns:[sk]};
    if(nb===2&&!TP.wrong)return {spot:[B],pulse:true,walls:1,title:'일부러 틀려 보기',body:'이번엔 <b>빗금 친 닫힌 칸</b>을 눌러 보세요. 왜 안 되는지 알려 드려요.',btns:[{k:'skipwrong',t:'건너뛰고 이어가기'}]};
    return {spot:[B],pulse:true,walls:1,title:`${nb+1}박을 이어요`,body:nb===3?'마지막 4박이에요. 이 음까지 이으면 음악이 흘러나와요!':'계속 이어요. 앞 음에서 가까운 음으로 가면 노래하기 편해요.',btns:[sk]};
  }
  // 2마디
  if(nb===0)return {spot:[B],pulse:true,walls:1,title:`2마디 · ${M.rn} 화음`,body:`왼쪽 <b>입구</b>는 앞 마디가 끝난 자리예요(마지막 음: ‘${nameOf(TOP-M.rin)}’). 여기서 이어서 <b>${notes}</b> 중 첫 음을 골라요.`,btns:[sk]};
  return {spot:[B],pulse:true,walls:1,title:`${nb+1}박을 이어요`,body:'1마디와 같은 방법이에요. 깜빡이는 칸 중에서 골라 이어요.',btns:[sk]};
}
function tpRender(){
  if(!TP.on)return;
  const v=tpView();TP.v=v;
  const nd=R.done.filter(Boolean).length,part=(R.done[R.m]||!M)?0:tpNb()/NB(),pct=Math.round(50+50*(nd+part)/NM);
  const html=`<div class="tp"><span>튜토리얼</span><span class="bar"><i style="width:${pct}%"></i></span><span>코드 ✓ · 음정 ${nd}/${NM}</span></div><b class="th${v.cls?' '+v.cls:''}">${v.title}</b><p>${v.body}</p><div class="tb">${v.btns.map(b=>`<button type="button" data-k="${b.k}" class="${b.pri?'pri':b.gh?'gh':''}">${b.t}</button>`).join('')}</div>`;
  const co=$('#tcoach');co.classList.toggle('lite',!!v.lite);document.body.classList.toggle('tplite',!!v.lite);
  if(html!==TP.html){TP.html=html;co.innerHTML=html;}
  const key=R.m+'|'+tpNb()+'|'+(v.spot?v.spot.join(','):'')+'|'+v.title;
  if(key!==TP.spotKey){TP.spotKey=key;const el=v.spot&&tutEls(v.spot)[0];if(el&&!v.lite){const t=el.getBoundingClientRect().top+scrollY-70;window.scrollTo({top:Math.max(0,t),behavior:'smooth'});}}
}
function tpBtn(e){
  const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='skip'||k==='stay'){TP.skipped=true;TP.finished=true;tpStop();return;}
  if(k==='finish'){TP.finished=true;tpStop();setLevel(1);showView(1);return;}   // 가이드를 마치면 장조연습으로
  if(k==='hear'){$('#playOne').click();return;}
  if(k==='hearall'){$('#play').click();return;}
  if(k==='next'){if(R.m===1&&TP.rhy===0&&TP.step>=3)TP.rhy=1;else TP.step=Math.min(3,TP.step+1);}
  else if(k==='prev')TP.step=Math.max(0,TP.step-1);
  else if(k==='fb'){TP.fb=null;TP.wrong=1;}
  else if(k==='skipwrong')TP.wrong=1;
  tpRender();
}
document.addEventListener('pointerdown',e=>{                // 닫힌(빗금) 탱크를 누르면: 이유를 튜토리얼이 설명
  if(!TP.on||!TP.v||!TP.v.walls||TP.fb)return;
  const t=e.target.closest&&e.target.closest('#board .tank.wall');if(!t)return;
  const c=cells[+t.dataset.r][+t.dataset.c];if(!c||c.n===undefined)return;
  e.stopPropagation();e.preventDefault();
  const nn=nameOf(c.n),notes=M.pc.map(n=>sn(n,M.fl)).join('·');
  TP.fb=M.opens[0].length&&isW()?{t:'온음표는 으뜸음만 열려요',b:`마지막 마디는 으뜸음 <b>${sn(M.pc[0],M.fl)}</b>(높게·낮게)만 고를 수 있어요. 깜빡이는 칸을 눌러요.`}
    :{t:`‘${nn}’는 닫혀 있어요`,b:`${M.rn} 화음은 <b>${notes}</b>로 이뤄져요. ‘${nn}’는 화성음이 아니라서 <b>빗금(닫힘)</b>이에요. 초보 방식은 화성음만 열려요. 나중에 <b>실전 방식</b>에서는 지나가는음·이웃하는음 같은 비화성음도 쓸 수 있어요.`};
  tpRender();
},true);
document.addEventListener('click',e=>{                      // 안내만 하는 단계(리듬 등): 눌러도 반응하지 않게
  if(!TP.on||!TP.v||!TP.v.solid||!TP.v.spot)return;

function openQR(){
  if(document.querySelector('.qrmodal'))return;
  const loc=location.href.split('#')[0],url=/^https?:/.test(loc)&&!/claude|anthropic/i.test(location.hostname)?loc:SHARE_URL;   // GitHub 등에 올린 주소에서는 그 주소를, 그 밖에는 공유 링크를 담음
  const qr=qrcode(0,'M');qr.addData(url);qr.make();
  const n=qr.getModuleCount(),mg=4;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))d+='M'+(c+mg)+','+(r+mg)+'h1v1h-1z';
  const t=n+mg*2,esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const m=mk('div','rm qrmodal',`<div class="box qrbox" role="dialog" aria-modal="true" aria-label="QR 코드"><img class="qrlg" alt="음플릭스" src="${QLOGO}"><h3>나도 작곡가</h3><p>휴대폰 카메라로 비춰 보세요.</p><svg viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges" role="img" aria-label="나도 작곡가 QR 코드"><path d="${d}" fill="#15110f"/></svg><p class="qurl">${esc(url)}</p><p>제작 : 대제중학교 이현도</p><button type="button" class="ok" id="qrClose" style="margin:0">닫기</button></div>`);
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.addEventListener('click',e=>{if(e.target===m||e.target.id==='qrClose')close();});
  m.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  m.querySelector('#qrClose').focus();
}
document.addEventListener('click',e=>{if(e.target.closest('#cQrBtn'))openQR();});

$('#cSlots').addEventListener('click',e=>{
  const b=e.target.closest('.cslot.fill,.cslot.act[data-i],.cslot.hole');if(!b)return;
  const i=+b.dataset.i;
  cStopPlay();cfb=null;
  cedit=(cedit===i)?null:i;renderChord();                               // 칸을 누르면 그 칸이 선택됨: 다시 고르거나 ‘지우기’(나머지 칸은 그대로, 안 맞는 칸은 빨간색 경고)
});

  extra:'<p class="sub">· 시작 코드(I · i · Imaj7)로 곡의 분위기를 정해요. 1 · 5 · 8마디는 이 코드로 돌아와요.<br>· 끝나기 전 마디는 집으로 풀리는 코드(V, V7, ♭VII …)로 “이제 끝나요” 하고 알려 주면 좋아요(종지).<br>· 화살표는 지금 레벨에서 갈 수 있는 길이에요. 같은 코드는 두 마디까지만 이어 쓸 수 있어요.</p>'});});

if(SEEN){const lv=lsGet('sd_lv'),n=lv===null?1:+lv;if(n>=1&&n<=3){clv=n;state.mode='real';resetOpts();}TUT.finished=true;}   // 다시 온 학생은 마지막 레벨(없으면 장조연습)로, 환영 카드 없이 시작

function showWelcome(){
  const m=mk('div','rm',`<div class="box" role="dialog" aria-modal="true" aria-label="환영해요"><h3>🎼 나도 작곡가</h3><p style="font-size:14.5px;color:var(--ink);line-height:1.6;margin:6px 0 14px">8마디짜리 곡을 만들어요.<br><b>① 코드</b>(반주 화음)를 고르고 → <b>② 음정</b>(멜로디)을 골라요.<br>어디서 시작할까요?</p><button type="button" class="ok" data-k="t" style="margin:0 0 8px">🌱 처음이에요 — 가이드와 함께 시작</button><button type="button" class="rnd" data-k="1" style="width:100%;margin:0 0 8px">🎼 해 본 적 있어요 — 장조연습</button><div style="display:flex;gap:8px;justify-content:center;font-size:13px"><button type="button" class="rnd" data-k="2" style="flex:1">단조연습</button><button type="button" class="rnd" data-k="3" style="flex:1">자유작곡</button></div></div>`);
  document.body.appendChild(m);
  m.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;m.remove();lsSet('sd_seen','1');
    if(b.dataset.k==='t'){setLevel(0);}else setLevel(+b.dataset.k);});
}
if(!SEEN)showWelcome();
})();

   'border-radius:calc(var(--fb-r,10px) + 6px);padding:18px 18px 16px;font:15px/1.55 var(--fb-font,system-ui,sans-serif);box-shadow:0 18px 48px rgba(0,0,0,.4)}',
 'h2{margin:0 0 4px;font:700 20px/1.3 var(--fb-disp,var(--fb-font,system-ui,sans-serif))}',
 '.lead{margin:0 0 12px;font-size:13.5px;color:var(--fb-mut,#666)}',
 '.kinds{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}',
 '.kind{font:inherit;font-size:13.5px;color:var(--fb-fg,#111);background:transparent;border:1px solid var(--fb-line,#ccc);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}',
 '.kind[aria-pressed="true"]{background:var(--fb-acc,#36c);border-color:var(--fb-acc,#36c);color:var(--fb-accfg,#fff);font-weight:600}',
 'textarea{display:block;width:100%;min-height:112px;max-height:40vh;resize:vertical;font:inherit;font-size:16px;color:var(--fb-fg,#111);',
   'background:var(--fb-field,transparent);border:1px solid var(--fb-line,#ccc);border-radius:var(--fb-r,10px);padding:10px 12px}',
 'textarea::placeholder{color:var(--fb-mut,#666);opacity:.8}',
 '.meta{display:flex;justify-content:space-between;gap:10px;margin:6px 0 0;font-size:12.5px;color:var(--fb-mut,#666)}',
 '#cnt{white-space:nowrap;font-variant-numeric:tabular-nums}',
 '.st{min-height:22px;margin:8px 0 0;font-size:13.5px}',
 '.st.ok{color:var(--fb-ok,#0a7)}.st.bad{color:var(--fb-bad,#c33)}',
 '.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}',
 '.b{font:inherit;font-size:15px;min-height:42px;padding:0 18px;border-radius:var(--fb-r,10px);border:1px solid var(--fb-line,#ccc);background:transparent;color:var(--fb-fg,#111);cursor:pointer}',
 '.b.pri{background:var(--fb-acc,#36c);border-color:var(--fb-acc,#36c);color:var(--fb-accfg,#fff);font-weight:600}',
 '.b:disabled{opacity:.5;cursor:default}',
 '@media (prefers-reduced-motion:no-preference){.dlg{animation:pop .14s ease-out}@keyframes pop{from{opacity:0;transform:scale(.97)}}}'
].join('');

var host=document.createElement('div');
host.id='devfb';
var vars=CFG.vars||{};
for(var vk in vars){if(Object.prototype.hasOwnProperty.call(vars,vk))host.style.setProperty(vk,vars[vk]);}
var root=host.attachShadow({mode:'open'});
root.innerHTML='<style>'+CSS+'</style>'+
 '<div class="tw" id="tw"><button type="button" class="trig" id="trig">개발자에게 의견 보내기</button></div>'+
 '<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="ttl" aria-describedby="lead">'+
 '<h2 id="ttl">개발자에게 보내기</h2>'+
 '<p class="lead" id="lead">이름 없이 개발자에게만 전달돼요. 답장은 받을 수 없어요.</p>'+
 '<div class="kinds" id="kinds" role="group" aria-label="종류"></div>'+
 '<label class="sr" for="msg">보낼 내용</label>'+
 '<textarea id="msg" rows="4" maxlength="'+MAX+'" placeholder="무엇이든 편하게 적어 주세요. 오류라면 어느 화면에서 무엇을 눌렀는지 알려 주시면 고치기 쉬워요."></textarea>'+
 '<div class="meta"><span>이름·학교·연락처 같은 개인정보는 적지 마세요.</span><span id="cnt">0/'+MAX+'</span></div>'+
 '<p class="st" id="st" role="status" aria-live="polite"></p>'+
 '<div class="btns"><button type="button" class="b" id="close">닫기</button><button type="button" class="b pri" id="send">보내기</button></div>'+
 '</div></div>';

function el(id){return root.querySelector('#'+id);}
var tw=el('tw'),trig=el('trig'),ov=el('ov'),kindsEl=el('kinds'),msg=el('msg'),cnt=el('cnt'),st=el('st'),closeBtn=el('close'),sendBtn=el('send');
var kind='say',sending=false,lastFocus=null,memLast=0,closeTimer=0;

(function(){
  var h='';
  KINDS.forEach(function(x){h+='<button type="button" class="kind" data-k="'+x[0]+'" aria-pressed="'+(x[0]===kind)+'">'+x[1]+'</button>';});
  kindsEl.innerHTML=h;
})();

function setStatus(t,c){st.textContent=t||'';st.className='st'+(c?' '+c:'');}
function syncCount(){cnt.textContent=msg.value.length+'/'+MAX;}
function getLast(){try{return Number(localStorage.getItem(LSK))||memLast;}catch(e){return memLast;}}
function setLast(){memLast=Date.now();try{localStorage.setItem(LSK,String(memLast));}catch(e){}}

function open(){
  clearTimeout(closeTimer);
  lastFocus=document.activeElement;
  ov.hidden=false;
  setStatus('');
  syncCount();
  setTimeout(function(){try{msg.focus();}catch(e){}},30);
}
function close(){
  clearTimeout(closeTimer);
  if(ov.hidden)return;
  ov.hidden=true;
  if(lastFocus&&lastFocus.focus){try{lastFocus.focus();}catch(e){}}
}

function viaForm(pairs){
  var name='devfb'+Date.now();
  var ifr=document.createElement('iframe');
  ifr.name=name;ifr.hidden=true;ifr.tabIndex=-1;ifr.setAttribute('aria-hidden','true');ifr.title='';
  var f=document.createElement('form');
  f.method='POST';f.action=CFG.url;f.target=name;f.hidden=true;f.acceptCharset='UTF-8';
  pairs.forEach(function(p){var i=document.createElement('input');i.type='hidden';i.name=p[0];i.value=p[1];f.appendChild(i);});
  document.body.appendChild(ifr);document.body.appendChild(f);
  f.submit();
  setTimeout(function(){try{ifr.remove();f.remove();}catch(e){}},6000);
}

function finish(text,cls){
  sending=false;sendBtn.disabled=false;sendBtn.textContent='보내기';
  setLast();
  msg.value='';syncCount();
  setStatus(text,cls);
  closeTimer=setTimeout(close,1800);
}

function send(){
  if(sending)return;
  var text=msg.value.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  if(text.length<MIN){setStatus('조금만 더 적어 주세요. ('+MIN+'자 이상)','bad');msg.focus();return;}
  if(Date.now()-getLast()<COOL){setStatus('방금 보냈어요. 잠시 뒤에 다시 보내 주세요.','bad');return;}
  var k=KINDS.filter(function(x){return x[0]===kind;})[0]||KINDS[2];
  var pairs=[[CFG.eApp,CFG.app],[CFG.eMsg,k[2]+' '+text]];
  var body=new URLSearchParams();
  pairs.forEach(function(p){body.append(p[0],p[1]);});
  sending=true;sendBtn.disabled=true;sendBtn.textContent='보내는 중…';setStatus('');
  var p;
  try{p=fetch(CFG.url,{method:'POST',mode:'no-cors',body:body});}catch(e){p=Promise.reject(e);}
  p.then(function(){
    finish('전송했어요. 고맙습니다!','ok');
  },function(){
    try{viaForm(pairs);finish('전송을 시도했어요. 도착했는지는 확인할 수 없어요.','ok');}
    catch(e){sending=false;sendBtn.disabled=false;sendBtn.textContent='보내기';setStatus('지금은 보낼 수 없어요. 인터넷 연결을 확인해 주세요.','bad');}
  });
}

trig.addEventListener('click',open);
closeBtn.addEventListener('click',close);
sendBtn.addEventListener('click',send);
msg.addEventListener('input',function(){syncCount();if(st.className.indexOf('bad')>-1)setStatus('');});
kindsEl.addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('.kind'):null;
  if(!b)return;
  kind=b.getAttribute('data-k');
  var all=kindsEl.querySelectorAll('.kind');
  for(var i=0;i<all.length;i++)all[i].setAttribute('aria-pressed',String(all[i]===b));
});
ov.addEventListener('click',function(e){if(e.target===ov)close();});
/* 앱의 단축키(방향키·스페이스·Esc 등)가 입력창에 끼어들지 않도록 키 입력은 여기서 멈춰요 */
ov.addEventListener('keydown',function(e){
  if(e.key==='Escape'){e.preventDefault();close();}
  else if(e.key==='Tab'){
    var f=ov.querySelectorAll('button:not([disabled]),textarea');
    if(f.length){
      var first=f[0],last=f[f.length-1],cur=root.activeElement;
      if(e.shiftKey&&cur===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&cur===last){e.preventDefault();first.focus();}
    }
  }
  e.stopPropagation();
});
ov.addEventListener('keyup',function(e){e.stopPropagation();});
ov.addEventListener('keypress',function(e){e.stopPropagation();});

if(!CFG.mount)tw.hidden=true;
var mountEl=CFG.mount?document.querySelector(CFG.mount):null;
(mountEl||document.body).appendChild(host);
if(CFG.hideAttr){
  var apply=function(){host.hidden=document.body.hasAttribute(CFG.hideAttr);};
  apply();
  try{new MutationObserver(apply).observe(document.body,{attributes:true,attributeFilter:[CFG.hideAttr]});}catch(e){}
}
window.__devFb={open:open,close:close};
})();
</script>

</body></html>
